# ============================================================================
# 模-1 · 凯利仓位(高级,默认关闭)  ★ 可挂载模块 —— 不单独建链
#
# 三秒版:你有多大把握,就下多大注。★ 但手册自己说了,这句话的数学形式
#         和股票的结构**对不上**,必须先做一步转换 —— 而那步转换手册没给。
#
# ★★ 这条**不是**原著完整。手册第 1104-1114 行原文:
#   「流传最广的那个写法(胜率减去败率除以盈亏比)对应的是
#     『赢了赔 b 倍、输了全亏』的二元赌局。股票不是这个结构:
#     你通常不会亏掉全部本金,收益是连续分布的。
#     ★ 所以那个公式的输出**不能直接当作股票仓位,必须先做转换**。」
#   ★ 这个「转换」手册没有给出任何形式 —— 这就是本条的 B 类缺口
#     (配置本身没定,不是引擎没写)。
#
# ★★ 第二个缺口:手册第 1109 行「实务上普遍用半凯利甚至四分之一凯利」——
#   ★ 用全凯利、半凯利还是四分之一,手册没拍。这是一个直接决定仓位倍数的数。
#
# ★★ 第三个缺口:手册第 1113 行「『100 笔就够』这个门槛不够。
#   门槛要看**独立性**,不只看笔数。」★ 独立性怎么量、门槛是多少,没给。
#
# ★★ 还有一条硬约束,比上面三条更关键 ——
#   附录 D.6「禁止字段清单」明文禁止 `position_factor` /
#   `recommended_position_percent` 这两个字段,理由是手册 11.4
#   「不给具体仓位调整建议」。
#   ★ 所以即使三个缺口都补齐,模-1 也**不允许输出一个仓位数字**。
#   ★ 本次因此只做一件事:在 技-1 的真实流水上算出凯利公式的**描述性输入**
#     (胜率、盈亏比、R 分布),并报「如果照搬那个二元公式会得到什么」,
#     ★ 明确标注它不是仓位建议,也不接到 sizing 上去。
#
# ★ 挂载方式:不改 技-1 的任何配置,只在 技-1 跑完之后读它的交易流水做统计。
#   ★ 为什么不真的挂上去改仓位:那需要上面三个没定的数,一挂就等于我们替手册拍了板。
# ============================================================================

meta:
  name: 模-1_凯利仓位
  master: John Kelly / Ed Thorp
  handbook_ref: v11 第 1102 行;附录 A 模-1;附录 D.6 禁止字段清单
  orig_claim: 公式本身是数学定理;把它用在股票上需要一系列假设,这些假设是否成立要单独验证
  runnable: 仅描述性统计(不接到仓位上)
  mount_type: 可挂载模块(不单独建链)
  mounted_on: 技-1(按任务书要求,只读流水、不改配置)
  param_gap: >-
    ★ 三处手册没给:① 二元公式→股票的「转换」形式;② 全/半/四分之一凯利的倍数;
    ③ 样本独立性的门槛。★ 外加附录 D.6 禁止输出仓位字段。
  default_state: 默认关闭(手册明文)

chain: null
