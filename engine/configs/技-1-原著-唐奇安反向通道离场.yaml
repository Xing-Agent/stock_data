# ============================================================================
# 技-1 · 系统化趋势跟随 · ★ 原著离场版(唐奇安反向通道)
#   (2026-10-29 新建,★ 不覆盖 技-1.yaml,也不覆盖 trend_following.yaml)
#
# 三秒版:收盘创 20 日新高就买,跌破 10 日最低价就走;止损 2N,不设止盈。
#
# ★★ 这一条是**修正我们装错的那一处**,说清楚错在哪:
#   · ★ 原著的离场**不是 ATR 回撤**,是**前 N 日反向极值低点(唐奇安通道)**:
#       系统 1(20 日突破入场) → 跌破过去 **10 日最低价** 全部平仓
#       系统 2(55 日突破入场) → 跌破过去 **20 日最低价** 全部平仓
#   · ★ 我们**真正在跑的那条链** `trend_following.yaml` 装的是:
#       ⑤ 吊灯移动止损 3.0×ATR20(浮盈 +2R 启动) + ⑥ 收盘跌破 MA50
#     → ★ 里面**一条唐奇安反向通道都没有**。这就是装错的地方。
#   · 旧文件 技-1.yaml 的离场本来就是对的(close_below_lowest_low 10 日)。
#     ★ 所以本轮不是「把错的改对」,而是**把对的那一版和在跑的那一版摆在一起**,
#       让「装错」这件事在数字上看得见。两条链本轮都跑。
#
# ★★ 原著有、引擎做不到的那一条(★ 必须明写,不许悄悄忽略):
#   ★ **加仓(金字塔)**:原著「以最初建仓价为基准,每顺向移动 0.5N 加 1 个单位,
#     上限 4 个单位;每加一个新单位,之前所有单位的止损同步上移到
#     最新成交价下方 2.0N」。
#   ★ 引擎**不支持**一个标的多个单位(一个 symbol 一个槽位,见 chain.py 的
#     `pos: dict[int, dict]` —— 按列号索引,一只票只能有一条仓位记录)。
#   → 本版只跑**单个单位**。★ 「没有加仓的海龟不是完整的海龟系统」,
#     ★ 所以本版的结论**不能当成海龟原版的结论**。
#   ★ 顺带一个必须讲清的推论:原著的「灾难防守线 = 跌破最后一次加仓点下方 2.0N」
#     在**只有 1 个单位**的情况下,「最后一次加仓点」≡ 最初建仓点,
#     → 灾难防守线 ≡ 进场价 − 2.0N ≡ ④ 步那条初始止损,**两者重合**。
#     ★ 也就是说:单单位版里灾难防守线不是「没装」,是「和初始止损是同一条线」。
#     ★ 一旦加仓能跑了,这两条线才会分开,那时必须重测。
#
# ★★ 另外两处「原著有、引擎做不到」(沿用 技-1.yaml 的交代,未变):
#   · 盘中成交:原著盘中突破即成交;引擎只能收盘确认 + 次日开盘。
#   · System 1 的「上一次突破是赢家就跳过」过滤器:引擎没实现,显式不加。
#     ★ 所以 20 日那一档比原著更频繁地进场;55 日(System 2)原著无此过滤器。
# ============================================================================

meta:
  name: 技-1_原著_唐奇安反向通道离场_System1
  master: Richard Dennis / Ed Seykota(海龟)
  book: 《The Original Turtle Trading Rules》(Faith 2003)
  三版归属: 原著版(离场)
  orig_claim: 原版规则公开且完整;XING 版是我们的改写,尚未验证
  原著有引擎做不到的项:
    - >-
      ★ 加仓(金字塔):每顺向 0.5N 加 1 个单位、上限 4 个单位、
      每加一单位把之前所有单位的止损上移到最新成交价下方 2.0N。
      ★ 引擎一只票只能有一条仓位记录 → 本版只跑单个单位。
      ★ 这是 A 类「引擎没写」,规则本身讲得很清楚,是工作量问题。
    - >-
      ★ 盘中成交:原著盘中突破即成交;引擎只能收盘确认 + 次日开盘。
    - >-
      ★ System 1 的「上一次突破是赢家就跳过」过滤器:引擎没实现,显式不加。
  本轮改了什么: >-
    与 技-1.yaml 相比:离场口径不变(本来就是对的),
    ★ 新增的是把「加仓/灾难防守线/2.0N 口径」逐条写死在 meta 里,
    以及把 ATR 周期在止损与通道之间的口径对齐写明(N = ATR(20))。
    ★ 真正要被修正的是 trend_following.yaml,本轮把它作为对照一起跑。
  caveat: >-
    原著证据来自期货 / 多空 / 跨品种分散;本次跑的是美股个股 / 只做多,
    手册明文「不能搬」。本次结论只对「美股个股只做多」这个口径成立。

# ① 选股范围 —— ★ 原著没有选股条件(海龟事先定好流动品种清单),全池照跑
universe:
  rules: []
  source: 原著(海龟无个股选股条件,全池照跑)

# ② 环境过滤 —— ★ 原著没有大盘择时开关。海龟从不看大盘在不在均线上
regime:
  rules: []
  flatten_when_off: false
  source: 原著(海龟无环境过滤;★ 留空是照原文,不是忘了填)

# ③ 进场扳机
entry:
  rules:
    - type: donchian_close_breakout
      params: { lookback: 20 }
      source: >-
        原著(Faith 2003):系统 1 入场 = 20 日通道突破。
        ★ runner 另跑系统 2(55 日入场 / 20 日出场)。
  signal_freeze: close
  fill: next_open
  source: 执行细节(原著盘中突破即成交;引擎只能收盘确认次日开盘)

# ④ 初始止损 = 2.0N,N = ATR(20)
initial_stop:
  type: atr_multiple
  params: { atr_period: 20, multiple: 2.0 }
  source: >-
    原著:海龟 2N 止损;N = ATR(20)(ATR 定义 Wilder 1978)。
    ★ 任务书明文 N = ATR(20) —— 与本文件一致。
    ★ 单单位版里这条线同时**就是**原著那条「灾难防守线」:
      「跌破最后一次加仓点下方 2.0N」在只有 1 个单位时 ≡ 进场价 − 2.0N。

# ⑤ 移动止损 —— ★ 原著没有移动止损,退出靠反向通道(见 ⑥)
trailing_stop:
  type: none
  source: >-
    原著(海龟无移动止损;★ 留 none 是照原文)。
    ★★ 这一行正是 trend_following.yaml 装错的地方:那条链在这里装了
      「浮盈 +2R 启动的吊灯 3.0×ATR20」—— ★ 原著没有这个东西。

# ⑥ 离场 = 唐奇安反向通道(系统 1 → 10 日;系统 2 → 20 日)
exit:
  rules:
    - type: close_below_lowest_low
      params: { lookback: 10 }
      source: >-
        ★★ 原著离场:系统 1 退出 = 跌破过去 **10 日最低价** 全部平仓。
        ★ runner 跑系统 2 时改成 20 日。
        ★ 写成**离场规则**而不是移动止损:原著的反向通道可以**往下跑**,
          而引擎的移动止损有「只许上移」铁律,两者不等价。
    - type: close_below_trailing_stop
      source: 原著(2.0N 初始止损照常生效 = 灾难防守线)
  params:
    profit_target_r: null
    time_stop_days: null
  fill: next_open
  source: 原著(海龟不设止盈)

# ⑦ 仓位
sizing:
  type: risk_fraction
  params:
    risk_per_trade: 0.02
    max_positions: 12
    max_weight: 1.0
  source: >-
    原著(推导写明):海龟「1 单位 = 账户 1% / N」,止损在 2N
    → 单笔风险 = 2% 账户。引擎的 risk_per_trade 是「到止损为止亏多少」,
    所以填 0.02 才等于原著的 1 单位。★ 不是我们挑的数,是换算出来的。
    槽位 12 = 原著「总持仓上限 12 个单位」;单票名义上限 1.0 = 原著无名义上限。
    ★ 单单位版里 12 个槽位 = 12 只不同的票,★ 原著那 12 个单位是可以堆在
      同一只票上的(最多 4 个)—— 这一处差别由上面的「加仓做不到」负责交代。

slots: 12
source_slots: 原著(海龟总上限 12 个单位,单单位制下 = 12 个并发持仓)

ranking:
  primary:
    formula: ADV20
    order: desc
    source: 执行细节(原著无排序;槽位满时必须有个决胜规则,选了最不含观点的那个)

costs:
  one_way_bps: 5.0
  source: 行业惯例(SEC Rule 206(4)-1(d);GIPS 2020 Section 2.A)

benchmark:
  family: trend
  component_match: large
  risk_free_annual: null
