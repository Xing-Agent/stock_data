# 买入持有 —— 最简单的一条链,专门用来给链执行器对数的。
# 作用:selftest 第③项拿它验证「执行器算出来的收益 = 手算的收益」。
# 七步里该关的全关掉:不过滤环境、不设止损、不止盈、不限笔数。
# ---------------------------------------------------------------------------
# ★★★ 出处可对账登记(2026-10-31 加)
#   这一份是**我们自己合成的「流派」**,不对应单一方法卡 —— 所以它没有 method_id。
#   ★ 后果:第三道卡口(出处 grep 对账)对这一份**无能为力**,
#     它里面每一条 `source: 原著` 都无法被机械核实。
#   ★★★ 要让它能被对账,需要逐条填下面这个表:每一条声称原著的规则,
#     指明它来自哪一张方法卡。★ 填之前,这一份里的「原著」一律不算已核实。
# ---------------------------------------------------------------------------
provenance:
  composite: true              # ★ 合成流派,非单一方法卡
  method_cards: []             # ★★★ 待填:这一份借用了哪几张方法卡(如 [技-1, 技-5])
  per_rule_cards_filled: false # ★★★ 待填:每条 source:原著 是否已指明来自哪张卡

meta:
  name: buy_and_hold
  purpose: 对数用的基线链;selftest ③ 依赖它
  owner: engine/selftest.py

# ① 选股范围:全开(实际用哪些票由命令行 --pool 或调用方的 symbols 决定)
universe: {}

# ② 环境过滤:不过滤
regime:
  rules: []
  flatten_when_off: false

# ③ 进场扳机:天天成立 → 第一个可交易日开盘买入,之后不再有现金可买
entry:
  type: always
  source: 基线链定义,非参数

# ④ 初始止损:等价于不设(0.1% 的名义止损价,实际永不触及)
initial_stop:
  type: pct
  params: { pct: 0.999 }
  source: 基线链定义,等价于不设止损

# ⑤ 移动止损:无
trailing_stop:
  type: none
  source: >-
    ★ XING 定义(不是原著)。buy_and_hold 是我们建的基线链,
    它的定义就是「买入后不做任何离场动作」,所以移动止损明确为无。
    ★ 代价:和 initial_stop 一样 —— 1R = 进场价,R 乘数退化成收益率,
    不能和有止损的链比每笔 R。

# ⑥ 离场:无(不止盈、不时间止损)
exit:
  type: signal_only
  params: {}

# ⑦ 仓位:等权买入持有,把现金一次性平摊给当天所有候选
sizing:
  type: equal_weight_all
  params: { max_weight: 1.0, max_positions: 1000 }
  source: 基线链定义,非参数

# 摩擦成本:对数时设 0,正式跑链一律 5bp
costs:
  one_way_bps: 0.0

benchmark:
  # ★★ 1029 新增:基准家族(bench_lines.benchmark_family 读这个字段)。
  #   trend   → 动态开关基准 + 静态基准 + 槽位机会成本线
  #   meanrev → 双轨:① 底线 = 无风险利率 ② 技能 = 朴素基准
  #   ★ 理由:买入持有是单边多头基线链 —— 单边多头指数就是它的天然对照
  family: trend
  component_match: large        # large→SPY / mid→MDY(仓库暂无) / small→IWM / equal_weight→RSP
  risk_free_annual: null        # ★ 仓库没有无风险利率序列,现金腿按 0% 记并标明
