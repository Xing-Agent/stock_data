# ============================================================================
# 流派一:系统化中长周期趋势跟随派
#
# 三秒版:大盘在 200 日线上方时,买创 55 日新高、且突破前刚缩过波动的票;
#         止损贴死,浮盈过 2R 后用吊灯止损一路往上抬,绝不设止盈。
#
# ★ 本文件是「照抄外部专家原文」的产物。所有数值与专家原文一字不差,
#   没有做任何优化、取整或调参。
#
# ★ source 字段约定(三选一):原著 / 行业惯例 / 我们搜的
#   ★ 本文件 "我们搜的" = 0 条。
#   ★ 凡 source 与专家原标注不一致的,一律在该行下方注明,并指向审计报告编号。
#   审计报告:/home/claude/三流派配置-参数审计-1028.md
#
# ★ 字段命名:按「三层薄执行器」七步接口(stop_init / stop_trail / slots / ranking)。
#   ★ 现有 _TEMPLATE_master.yaml 用的是 initial_stop / trailing_stop,
#     两套名字不一致 —— 见审计报告 §4-A,需与执行器那条线对齐后才能加载。
# ============================================================================

# ---------------------------------------------------------------------------
# ★★★ 出处可对账登记(2026-10-31 加)
#   这一份是**我们自己合成的「流派」**,不对应单一方法卡 —— 所以它没有 method_id。
#   ★ 后果:第三道卡口(出处 grep 对账)对这一份**无能为力**,
#     它里面每一条 `source: 原著` 都无法被机械核实。
#   ★★★ 要让它能被对账,需要逐条填下面这个表:每一条声称原著的规则,
#     指明它来自哪一张方法卡。★ 填之前,这一份里的「原著」一律不算已核实。
# ---------------------------------------------------------------------------
provenance:
  composite: true              # ★ 合成流派,非单一方法卡
  method_cards: []             # ★★★ 待填:这一份借用了哪几张方法卡(如 [技-1, 技-5])
  per_rule_cards_filled: false # ★★★ 待填:每条 source:原著 是否已指明来自哪张卡

meta:
  name: 流派一_系统化中长周期趋势跟随
  master: Richard Donchian / Curtis Faith(海龟)
  modern: Andreas Clenow (2013/2015);AQR (Moskowitz/Ooi/Pedersen 2012)
  book: Donchian (1960);Faith《Way of the Turtle》(2007)
  # ★ 专家把原著写成《Trend Following Strategies in Commodity Futures》(1960)。
  #   核不到这个书名 —— 见审计报告 §1-E。
  pricing_belief: 收益分布非对称重尾,宏观大资金调仓有物理惯性;截断亏损、让利润奔跑
  best_regime: 宏观单边大牛市、产业主升浪、6 个月以上单边低波推升
  worst_regime: 宽幅震荡、均值回归轮动(2015 全年、2018 前三季)
  evidence_grade: 极高(Moskowitz/Ooi/Pedersen 2012 JFE;Hurst/Ooi/Pedersen 2017 JPM;
                  Brock/Lakonishok/LeBaron 1992 JF)
  # ★ 数据只到 2016-01-01 起,2015 全年这段「必然失灵」样本测不到 —— 见审计报告 §3-F。

# ---------------------------------------------------------------------------
# ① 选股范围 → [日期 × 票] 的 0/1 矩阵
# ---------------------------------------------------------------------------
universe:
  rules:
    - type: adv_rank_exclude_bottom
      params: { adv_period: 20, exclude_bottom_pct: 20 }
      source: 行业惯例
      # ★ 专家原文是「剔除 ADV20 全市场后 20%」。我们池子只有 300 只,
      #   算出来的是「池内后 20%」,不是全市场后 20% —— 见审计报告 §3-A。
      #   ★ 这里不替专家改口径,原文照留,等他定。
    - type: price_above_ma
      params: { ma: 200 }
      source: 行业惯例

# ---------------------------------------------------------------------------
# ② 环境过滤 → [日期] 的 0/1 向量(全市场共用)
# ---------------------------------------------------------------------------
regime:
  rules:
    - type: index_above_ma_scaled
      params: { symbol: SPY, ma: 200, factor: 0.99 }
      source: 行业惯例
    - type: index_ma_slope
      params: { symbol: SPY, ma: 200, lookback: 20, min_slope: 0.0 }
      source: 行业惯例
      # 专家标注「行业惯例(Faber 2007)」。Faber 2007 用的是 10 个月 SMA,
      # 不含 20 日斜率闸门 —— 斜率这一条核不到 Faber 出处,见审计报告 §1-F。
  flatten_when_off: false        # 原文:「不满足则全局休眠,禁止任何新开仓」= 只停新开仓
  source: 行业惯例
  # ★★★ 2026-10-31 改的是**这一行的标注**,★ 参数一个都没动。
  #   旧写法:块级 `source: 原著`,而底下逐条规则的 source 全是「行业惯例」——
  #   块与条自相矛盾。★ 海龟原始规则里**根本没有大盘闸**,所以块级不能标原著。
  #   ★ 为什么非改不可:只读块级的人会把整块当成已核实的原著
  #   (排查报告 §五 第 11 处 + 「靠人读抓到的 5 处归属错」之一)。

# ---------------------------------------------------------------------------
# ③ 进场扳机 → [日期 × 票] 的布尔矩阵
# ---------------------------------------------------------------------------
entry:
  rules:
    - type: donchian_close_breakout
      params: { lookback: 55 }
      source: 原著
      # ★ 55 这个数是真的(海龟 System 2 进场周期),但专家给的出处页码是错的:
      #   《Way of the Turtle》Ch.5 是 "Trading with an Edge",不含系统参数;
      #   该书正文 Ch.3 叙述 System 2 时写的是 60 日。55 出自另一份文件
      #   《The Original Turtle Trading Rules》(Faith 2003,该书附录重印)。
      #   ★ 见审计报告 §1-A。参数值不动,只纠出处。
    - type: atr_squeeze
      params: { atr_fast: 10, atr_slow_ma: 50, max_ratio: 0.85, offset_days: 1 }
      source: 行业惯例
      # 原文:突破前 10 日满足 ATR10(t−1) / SMA50(ATR)(t−1) < 0.85(Kaufman 波动率挤压)
      # ★ 原文「突破前 10 日满足」有歧义:是只看 t−1 这一天,还是前 10 天每天都要满足?
      #   见审计报告 §2-A。★ 没有自己定,照原文留 offset_days: 1。
  signal_freeze: close           # 信号收盘固化
  fill: next_open                # 次日开盘成交
  source: 原著

# ---------------------------------------------------------------------------
# ④ 初始止损(进场当时定死,同时决定仓位)
# ---------------------------------------------------------------------------
stop_init:
  type: tightest_of
  components:
    - type: atr_multiple
      params: { atr_period: 20, multiple: 2.5 }
      source: 行业惯例
      # ★★ 专家标成「原著写死(海龟 2N 的现代微调版)」—— 这两句自相矛盾。
      #   海龟原版是 2N(N = 20 日 ATR),2.5 不是原著数字,查不到谁加的。
      #   按专家自己的措辞「现代微调版」,这里只能算行业惯例。
      #   ★ 见审计报告 §1-B。参数值 2.5 不动。
    - type: lowest_low
      params: { lookback: 20 }
      source: 原著
  select: nearest_to_price       # 原文:两者取离现价更近者
  r_definition: abs(entry_price - stop_price)
  source: 原著

# ---------------------------------------------------------------------------
# ⑤ 移动止损(多阶段)
# ---------------------------------------------------------------------------
stop_trail:
  stages:
    - name: 锁死期
      when: { unrealized_r_between: [0.0, 2.0] }
      action: hold_initial_stop   # 止损锁死不动
      source: 原著
    - name: 吊灯期
      when: { unrealized_r_gt: 2.0 }
      type: chandelier
      params: { lookback: 20, multiple: 3.0, atr_period: 20 }
      source: 行业惯例
      # 浮盈 +2R 启动:Chuck LeBeau (1992);吊灯 3.0×ATR20:LeBeau
      # 公式:Stop_t = max(Stop_{t−1}, HighestHigh20 − 3.0×ATR20)
  monotonic_up_only: true        # ★ 只许单向上移(引擎铁律,配置不得关闭)
  source: 行业惯例
  # ★★★ 2026-10-31 改的是**这一行的标注**,★ 参数(2.0 / 20 / 3.0)一个都没动。
  #   ★ 海龟原著**没有移动止损** —— 退出靠 20 日反向通道。
  #     吊灯是 LeBeau (1992),底下那一条自己也标着「行业惯例」。
  #   → 块级标「原著」是把我们/专家的做法记成了原著。

# ---------------------------------------------------------------------------
# ⑥ 离场
# ---------------------------------------------------------------------------
exit:
  rules:
    - type: close_below_trailing_stop
      source: 原著
    - type: close_below_ma
      params: { ma: 50 }
      source: 行业惯例
      # ★★★ 2026-10-31 改的是**这一行的标注**,★ 参数 50 一个字没动。
      #   ★ 原著(海龟 System 2)的离场是**跌破过去 20 日最低价**
      #     (唐奇安反向通道)—— 这条链里**一条反向通道都没有**。
      #   ★ MA50 在上升趋势里远高于 20 日通道下沿 → 出得比原著早很多。
      #   ★ 改回原著的那一版另开一份:
      #     `trend_following-原著-唐奇安反向通道离场.yaml`(数值未动,
      #     因为 50 是这一份专家版的数)。
  profit_target_r: null          # ★ 绝不设静态止盈(这一条与原著一致)
  time_stop_days: null
  fill: next_open                # 次日开盘全平
  source: 行业惯例
  # ★ 块级标注同上:这一块里只有「不设止盈」与原著一致,离场规则不是原著。

# ---------------------------------------------------------------------------
# ⑦ 仓位
# ---------------------------------------------------------------------------
sizing:
  type: risk_fraction
  params:
    risk_per_trade: 0.01         # 单笔风险 = NAV × 1.0%
    max_weight: 0.10             # ★ 单票名义上限 10% NAV(2026-10-28 专家结论,已锁)
  source: 行业惯例
  # ★★★ 2026-10-31 改的是**这一行的标注**,★ 数值 0.01 一个字没动。
  #   旧写法:`source: 原著`,并写着「单笔 1.0%:原著写死(海龟法则)——
  #   **已核实**,原始海龟规则确为每单位 1% 权益」。
  #   ★ 这句话把两件事混了:原著的「1% 权益」是**单位大小公式的分子**
  #     (1 单位 = 账户 1% / N),配上 2N 止损,**单笔风险是 2%**;
  #     而引擎 `risk_per_trade` 的定义是「到止损为止亏多少」。
  #   → 填 0.01 等于**只有原著一半的仓位**,它不是原著,是这一版的做法。
  #   ★★ 同一条原著规则 `技-1.yaml` 推导对了(填 0.02,换算逐字写在 source 里);
  #     两份配置对同一条原著规则给出了相差一倍的实现,其中一份自称「已核实」。
  #   ★ 为什么只改标注不改数:这一份是**专家/行业版**,0.01 是专家给的数,
  #     改它属于换参数。★ 改回原著的那一版另开一份:
  #     `trend_following-原著-唐奇安反向通道离场.yaml`。
  # ★ 单票上限原为 15%(行业惯例 UCITS),2026-10-28 随 slots=10 一起改成 10%,
  #   理由同 slots(长尾遮蔽效应):10 槽 × 10% = 100%,两个数必须自洽。
  #   ★ 两条出处不同级,拆开看见审计报告 §1-G。

# ---------------------------------------------------------------------------
# slots / ranking
# ---------------------------------------------------------------------------
slots: 10
source_slots: 行业惯例
# ★★ 2026-10-28 补齐:专家结论 slots = 10,单票名义上限 10% NAV。
#
# 大白话(「长尾遮蔽效应」):55 日突破的胜率只有 30–35%,全部正期望靠最前面
#   5–8% 的极端大牛股扛着。槽位太少会被平庸的试错单占满,真龙头来了没位置。
#   所以槽位不是风控旋钮,是「能不能接住决定全局的那几只」。
#
# 出处(标注:行业惯例):
#   · Clenow《Stocks on the Move》(2015) Ch.6 —— 用 20 个槽位
#   · Statman (1987, JFQA) —— 12~15 只已吸收 90% 以上的特质风险
#
# ★★ 三档照样并列报:3 / 5 / 10。理由是我们自己测出来的事实 ——
#   上一批 slots 把结论的符号翻了(−5.9% / −13.8% / +9.3%)。
#   ★ 结论用 10 档,但三档数字必须摆在一起,不许只报一档。
# ★ 历史记录:此前这里是 null(第二轮专家未答,审计 §2-E),没有自己填数。

# ---------------------------------------------------------------------------
# 排序(第二轮专家补齐)
# ---------------------------------------------------------------------------
ranking:
  primary:
    formula: (Close_t / Close_{t-60} - 1) / ATR_pct_20(t)
    order: desc                    # 从大到小
    source: 行业惯例                # Clenow 趋势动量归一化
  tiebreak:
    field: adv_20
    order: desc                    # ADV20 较大者优先
    source: 行业惯例
  # ★ 口径待确认:ATR%20 = ATR20 / Close 还是 ATR20 / SMA20(Close)?
  #   专家写的是 ATR%20(t),没给分母。见审计报告 §5-G。
  #   ★ 没有自己定分母,先按 ATR20/Close_t 写,须专家点头。
  atr_pct_denominator: close_t

# ---------------------------------------------------------------------------
# 摩擦成本与基准
# ---------------------------------------------------------------------------
costs:
  one_way_bps: 5.0
  source: 行业惯例                # SEC Rule 206(4)-1(d);GIPS 2020 Section 2.A

benchmark:
  # ★★ 1029 新增:基准家族(bench_lines.benchmark_family 读这个字段)。
  #   trend   → 动态开关基准 + 静态基准 + 槽位机会成本线
  #   meanrev → 双轨:① 底线 = 无风险利率 ② 技能 = 朴素基准
  #   ★ 理由:趋势/突破类
  family: trend
  component_match: large
  risk_free_annual: null         # 仓库没有短端利率序列,现金腿按 0% 记并在结果里标明
