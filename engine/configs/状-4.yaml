# ============================================================================
# 状-4 · 威科夫区间结构(Richard D. Wyckoff)  ★ 状态判定 —— 不产生交易信号
#
# 三秒版:在一个震荡区里,数出发生过哪些可数的结构事件。
#         ★ 它不给进场点、不给止损、不给仓位 —— 所以**不跑回测**,只出分布统计。
#
# ★ 五类事件(手册原文):下刺收回 / 上冲回落 / 低点抬高 / 触及未破 / 缩量测试
# ★ 手册给死的参数只有一条:「缩量」= 成交量低于前次同类事件
# ★ 手册锁死的边界:不输出「吸筹」「派发」「洗盘」「主力」中的任何一个。
#   附录 D.6 在数据契约层禁掉了 phase 字段 —— 本次产出里没有任何这类标签。
#
# ★★ 两处「手册没写死」—— 已列入报告「要回去问」:
#
#   一、**区间边界依赖 状-1,而 状-1 的参数在附录 D.8 里是「待校准」**。
#      D.8 原文:「状-1 ZigZag 阈值 3 × ATR(14);摆动点取影线还是收盘 —— 待校准」
#      ★ 后半句不是一个待校准的数,是一个**还没做的定义选择**:
#        取影线和取收盘会得出不同的摆动点,因此得出不同的区间边界,
#        因此得出不同的事件计数。★ 这一处必须先定,状-4 才有唯一解。
#      ★ 本次用「取影线(high/low)+ 3×ATR(14)」跑,并同时跑「取收盘」一版对照,
#        让这个选择的影响看得见。★ 两版都不构成结论。
#
#   二、**手册写「需要日内数据判断『下刺当天收回』」,而我们只有日线**。
#      ★ 本次用日线读法:当日最低价跌破区间下沿、当日收盘又收回到下沿之上。
#      ★ 这是能力缺口(拿不到日内数据),不是参数缺口 —— 必须写明。
#
# ★ 产出:五类事件各出现多少次、每类的成交量分位分布、分布是否合理。
#   ★ 不出收益、不出胜率 —— 这条没有交易信号,出收益就是编。
# ============================================================================

