# ============================================================================
# 流派二:动量结构与波动率挤压突破派(VCP)
#
# 三秒版:在已经领涨的强势股里,等它波动一级级收缩、成交量枯竭,
#         然后突破前 5 日高点就买;止损不许超过 8%,否则这单不做。
#
# ★ 本文件是「照抄外部专家原文」的产物。所有数值与专家原文一字不差。
# ★ source 字段约定(三选一):原著 / 行业惯例 / 我们搜的
#   ★ 本文件 "我们搜的" = 0 条。
# ★★ 第二轮更新(1028 晚):专家补齐了 VCP 收缩的全部死数、缩量门槛、
#   突破日量区间、动量选股逻辑、排序规则。本条链现在**可以跑**。
#   ★ 新填的数全部来自专家书面答复,★ 仍然「我们搜的」= 0 条。
#   ★ 但第二轮的出处标注又有 4 处核不实,已按纪律降级为「行业惯例」
#     或「来源存疑」,★ 数值一个没动。见审计报告第五节。
#
# 审计报告:/home/claude/三流派配置-参数审计-1028.md
# 字段命名按七步接口(stop_init / stop_trail / slots / ranking),
# 与现有 _TEMPLATE_master.yaml 的 initial_stop / trailing_stop 不一致,见 §4-A。
# ============================================================================

meta:
  name: 流派二_动量结构与波动率挤压突破_VCP
  master: William O'Neil;Mark Minervini
  modern: Kristjan Qullamaggie;Bob Volman (2014);George & Hwang (2004)
  book: O'Neil《How to Make Money in Stocks》(1988, 4th ed 2009) Ch.1 Ch.10;
        Minervini《Trade Like a Stock Market Wizard》(2013) Ch.8 Ch.10;
        Minervini《Think & Trade Like a Champion》(2017)
  pricing_belief: 领涨成长股被机构锁仓后微观波动率阶梯衰减;供给枯竭 + 阻力位临界突破
                  → 抢筹与空头踩踏 → 极端正偏态爆发
  best_regime: 产业革命爆发期(2023–2024 AI 硬件)、脱离熊市底部的 Stage 2 初期
  worst_regime: 加息尾声紧缩去杠杆(2022 全年)、指数虚高但广度恶化的断层期
                (2021 下半年,假突破率激增到 70% 以上)
  evidence_grade: 中高 —— 截面动量坚固,几何形态缺独立论文
                  (Jegadeesh & Titman 1993 JF;George & Hwang 2004 JF;
                   Ang/Hodrick/Xing/Zhang 2006 JF)
  # ★ Ang 等 (2006) 的结论是「高特质波动 → 低预期收益」,
  #   引来支持波动率挤压突破,方向上不直接相符 —— 见审计报告 §1-H。

# ---------------------------------------------------------------------------
# ① 选股范围 → [日期 × 票] 的 0/1 矩阵
# ---------------------------------------------------------------------------
universe:
  rules:
    # ★ 待 Lin 确认 #3(§3-B):原文是「剔除市值后 20%」,但我们没有 PIT 市值。
    #   ★ 此处按我的倾向改用 ADV20 做规模筛选(PIT 干净,且与另两条链口径统一),
    #     ★ 待 Lin 确认。Lin 若选「用规模代理」,把下面这块换回
    #     mktcap_rank_exclude_bottom 并接 WeightedAverageDilutedShares × Close。
    - type: adv_rank_exclude_bottom
      params: { adv_period: 20, exclude_bottom_pct: 20 }
      source: 行业惯例
      pending_lin: "#3 市值 vs ADV —— 此处按 Claude 倾向用 ADV20,待 Lin 确认"
      # ★ 口径问题仍在:池内后 20% ≠ 全市场后 20%,见审计报告 §3-A
      #   (待 Lin 确认 #1,此处按我的倾向「照原数跑、结果里标明闸门没在干活」)。

    # --- 动量选股:第二轮专家明确为两条 AND(宏观基底 + 微观进攻)---
    - type: momentum_dual_gate
      logic: AND
      components:
        - name: 宏观基底
          type: mansfield_rs_positive
          params: { against: SPY, lookback: 250 }
          source: 原著
        - name: 宏观基底_行业
          type: mansfield_rs_positive
          params: { against: SECTOR, lookback: 250 }
          source: 原著
          enabled: true
          pending_lin: "#4 行业 RS —— 专家第二轮明确要求保留,此处照其设计开启;
                        ★ 我的倾向是另跑一版关掉它做对比(见下 variant 开关),待 Lin 确认"
          # ★★ 数据污染仍未解决:行业归属只有
          #   sector_classification_current_non_pit.csv,元数据写明
          #   "pit_status": "non_pit_current_classification" —— 用今天的行业标签
          #   跑 2016 年,整段回测都在用未来信息。
          #   ★ 另外 XLC 只有 2018-06 起、XLRE 只有 2015-10 起,
          #     2016–2018 这两个行业算不出 RS_行业。见审计报告 §3-C。
        - name: 微观进攻
          type: return_rank_percentile
          params: { lookback: 60, min_percentile: 85.0 }
          source: 行业惯例
          # ★ 按协调人指示标「行业惯例」:专家自承 85 分位是「交易台收紧」,
          #   不是 O'Neil 原著(O'Neil 是 80 分位)。
          # ★★ 但请注意一件事(见审计报告 §5-E):
          #   ★ 85 分位 ≡ 前 15%,和第一轮那个「前 15%」是同一个数。
          #   ★ 专家把它说成「收紧」,实际一个字没动。
      source: 行业惯例
      variant_without_rs_sector: true
      # ★ 这个开关给对比跑用:true 时额外产出一份关掉行业 RS 的结果,
      #   用来量化 RS_行业(非 PIT、被污染)到底贡献了多少。

    - type: ma_stack_bullish
      params: { mas: [50, 150, 200], require_price_above_all: true }
      source: 原著                 # Minervini 趋势模板
      # ★ §2-D 第二轮仍未答:「多头排列」是否要求 MA50 > MA150 > MA200 严格排序、
      #   排序要维持几天,专家没回。此处按字面保留,排序严格度待确认。
    - type: ma_stack_bullish
      params: { mas: [50, 150, 200], require_price_above_all: true }
      source: 原著                 # Minervini 趋势模板
      # ★ 原文「三线多头排列」没说是否要求 MA50 > MA150 > MA200 的严格排序,
      #   也没说排序要维持几天 —— 见审计报告 §2-D。
      #   ★ 这里按字面保留「价格在三线上方 + 多头排列」,排序严格度待专家确认。

# ---------------------------------------------------------------------------
# ② 环境过滤 → [日期] 的 0/1 向量
# ---------------------------------------------------------------------------
regime:
  rules:
    - type: index_above_ma
      params: { symbol: SPY, ma: 200 }
      source: 行业惯例
    - type: index_ma_slope
      params: { symbol: SPY, ma: 200, lookback: 20, min_slope: 0.0 }
      source: 行业惯例
    - type: no_distribution_day
      params: { symbol: SPY, window: 5, single_day_drop_pct: 1.5 }
      source: 行业惯例
      # 原文:SPY 过去 5 日内无单日跌幅 > 1.5% 的分发日
      # ★ 原文把「跌幅 > 1.5%」直接等同于「分发日」,但 O'Neil 体系的分发日
      #   还要求放量。这里按原文字面只用跌幅,不加量能条件 —— 见审计报告 §2-G。
  flatten_when_off: false
  source: 原著

# ---------------------------------------------------------------------------
# ③ 进场扳机 → [日期 × 票] 的布尔矩阵
# ---------------------------------------------------------------------------
entry:
  rules:
    # =======================================================================
    # ★ 第①关:VCP 几何收缩 —— 跨 15~65 天的「选拔门禁」(状态机)
    #   ★ 第二轮专家给齐了全部死数,一个字没改。
    # =======================================================================
    - type: vcp_contraction
      stage: selection_gate            # 选拔门禁(不是点火)
      params:
        # --- 波段切分:5 根 Bar 局部极值分型(2-1-2 Fractal)---
        swing_method: fractal_2_1_2
        fractal_half_width: 2          # 局部高点 High_t = max(High[t-2..t+2])
                                       # 局部低点 Low_t  = min(Low[t-2..t+2])
        # 一个收缩波段 = 从局部高点 High_k 到其后的局部低点 Low_k
        # 形态自基底起点 High_0 开始:Low_1 → High_1 → Low_2 → … → Pivot
        base_min_days: 15              # 15 ≤ T_total ≤ 65 个交易日
        base_max_days: 65

        # --- 振幅公式(★ 死数,不许改)---
        range_metric: (High_k - Low_k) / High_k    # 统一用该段高点作分母
        forbid_atr_ratio: true
        # ★ 专家明确禁止用 ATR 比值。原话理由:
        #   「ATR 会随波动率同步缩小,抹杀收缩的几何绝对比例」

        first_contraction_max_depth: 0.300         # D_1 ≤ 30.0%

        # --- 递减系数 ---
        decay_coefficient: 0.65        # D_k ≤ 0.65 × D_{k−1}
        # 例:第一段 20% → 第二段 ≤13% → 第三段 ≤8.45%

        # --- 收缩次数 ---
        min_contractions: 2            # 2 次即成立(2T)
        max_contractions: 4            # 最多 4 次(4T)
      source: 行业惯例
      # ★★ 出处降级说明(第二轮审计,数值一个没动):
      #   · 波段切分/分型 → 专家标「行业惯例(Volman 2014 分型标准算法)」,照留。
      #   · D_1 ≤ 30.0% → 专家标「原著写死(Minervini 2013 Ch.10)」。
      #     ★ 章节对了(2013 Ch.10 确为 "Mastering the Volatility Contraction
      #       Pattern"),★ 但 30% 这个硬上限核不实 —— Minervini 讲第一段回撤时
      #       举的例子是「20%、25%、33%」,33% 会被 30% 的门槛挡掉。
      #     ★ 降级为行业惯例。见审计报告 §5-A。
      #   · 递减 0.65 → 专家标「原著写死」,但他自己括号里写的是
      #     「通常为一半到三分之二,取上限 65%」。
      #     ★ 二手资料查到的 Minervini 通行说法是「约为前一段的一半」(half-rule),
      #       查不到「到三分之二」这个上限。0.65 比 half-rule 宽。
      #     ★ 降级为行业惯例。见审计报告 §5-B。
      #   · 2~4 次 → 专家标「原著写死(Minervini 2017 Ch.5)」。
      #     ★ 内容(2~4 次)与二手资料大致相符,★ 但 2017 Ch.5 是
      #       "Compound Money, Not Mistakes"(讲复利与错误),不是 VCP 章;
      #       VCP/买入在 Ch.6–7。★ 出处错(这是他第二次给错 2017 的章号)。
      #     ★ 降级为行业惯例。见审计报告 §5-C。

    # =======================================================================
    # ★ 第②关:σ5 点火门禁 —— ★ 串联在几何之后,不是并列
    #   执行顺序:先满足 VCP 几何 → 状态机才激活 σ5 扫描 →
    #            形态满足但突破当天 σ5 未收缩 → ★ 放弃本次突破
    # =======================================================================
    - type: sigma_squeeze
      stage: ignition_gate
      requires_stage: selection_gate   # ★ 串联依赖:几何没过,这一关不扫
      params:
        fast_period: 5                 # 5 日收益率标准差
        slow_period: 20                # 20 日收益率标准差
        max_ratio: 0.65                # σ5 < 0.65 × σ20
        evaluate_on: breakout_day      # 突破当天评估;不满足则放弃本次突破
        anchor: last_contraction_right_side   # 最后一次收缩的右侧
      source: 行业惯例
      on_fail: abandon_breakout

    # =======================================================================
    # ★ 第③关:缩量 + 突破
    # =======================================================================
    # =======================================================================
    # ★★ 成交量三条件(专家 2026-10-28 修正版)
    #
    # ★ 这一块取代了原来的 volume_dryup + breakout_volume_band 两条。
    #   ★ 专家书面承认:上一轮给的写法是**自毁的** —— 它要求成交量在一天之内
    #     从「不到 50 日均量的 6 成」跳到「均量以上」(至少放大 1.67 倍),
    #     把「突破前要缩量」和「突破当天要放量」掐在同一个数上。
    #     ★ 实测后果:八年全池只成交 1 笔,不是成绩差,是没法评估。
    #
    # 大白话:缩量和放量本来是形态的前后两段,不该挤在同一天比。
    #   改成三件事分开说 ——
    #     ① 突破之前出现过「地量日」(筹码沉淀),只要有一天就算
    #     ② 突破前 5 日均量整体**收敛**(是收敛 0.85,不是冰冻 0.60)
    #     ③ 突破当天**温和**放量(对慢均量 ≥1.00,对自己前 5 日均量 ≥1.20)
    #
    # ★★ 来源标注:行业惯例(专家 2026-10-28 修正版)。
    #   ★ 不许标「原著写死」—— 专家自己说了原著对此是**定性描述**,
    #     这三个阈值是现代交易台的工程化写法,不是书里的数。
    #
    # ★ 专家预计:八年样本能从 1 笔放到 180–260 笔。跑完要对一下这个预期,
    #   差很远就是我们实现得不对,要查。
    # =======================================================================
    - type: vcp_volume_tripod
      params:
        fast_period: 5
        slow_period: 50
        min_day_lookback: 5            # 条件1 看突破前 5 天(t−5 .. t−1)
        dryup_day_ratio: 0.60          # 条件1 min(Vol[t−5..t−1]) ≤ 0.60 × SMA50(t−1)
        converge_ratio: 0.85           # 条件2 SMA5(t−1)        ≤ 0.85 × SMA50(t−1)
        breakout_vs_slow: 1.00         # 条件3 Vol[t] ≥ 1.00 × SMA50(t−1)
        breakout_vs_fast: 1.20         # 条件3 Vol[t] ≥ 1.20 × SMA5(t−1)
      source: 行业惯例(专家 2026-10-28 修正版)
      # ★ 注意一处随本次修正一起消失的东西,必须讲清楚、不许装作没发生:
      #   ★ 原 breakout_volume_band 的**上限 1.80**(防算法诱多的安全阀)
      #     在新写法里**没有对应条件** —— 条件3 只有下界、没有上界。
      #   ★ 而那个 1.80 是整个项目里唯一一条由我们自己的数据定下来的参数。
      #   ★ 本次按「照抄、不许改」执行,所以上限已移除;
      #     ★ 这一条要回头问专家:温和放量的上限还要不要?(报告里单列)

    - type: donchian_close_breakout
      params: { lookback: 5 }
      source: 行业惯例              # Qullamaggie / Volman
  signal_freeze: close
  fill: next_open_market           # 次日开盘市价进
  execution_order: [selection_gate, ignition_gate, volume_tripod, breakout]
  # ★ 最终扳机 = 价格突破 AND 条件1 AND 条件2 AND 条件3(专家 2026-10-28 修正版)
  source: 原著

# ---------------------------------------------------------------------------
# ④ 初始止损
# ---------------------------------------------------------------------------
stop_init:
  type: structure_low_minus_atr
  params:
    structure_lookback: 5          # 过去 5 日收缩区间最低价
    atr_period: 14
    atr_multiple: 0.2              # 下方 0.2×ATR14
  source: 原著
  hard_gate:
    type: max_stop_distance_pct
    params: { max_pct: 8.0 }
    on_violation: reject_signal    # ★★ 止损距离 > 8.0% → 信号作废,严禁开仓
    source: 原著
    # 专家标注「原著写死(O'Neil 2009 Ch.10 的 7~8% 硬止损)」。
    # 7~8% 这个数字是 O'Neil 的、无疑;章节定位只拿到二手书评的佐证
    # (Ch.10 = 卖出/止损章),没有核到书本身。★ 见审计报告 §1-C。
    # ★ 另外:原文把 O'Neil 的「7~8%」单边取成 8.0%,这一步是专家做的取值。

# ---------------------------------------------------------------------------
# ⑤ 移动止损(多阶段)
# ---------------------------------------------------------------------------
stop_trail:
  stages:
    - name: 保护期
      when: { days_held_lte: 10 }
      action: hold_initial_stop     # 前 10 个交易日只认初始结构止损
      source: 原著
    - name: 滞涨换血
      when:
        days_held_gte: 15
        unrealized_r_between: [-0.3, 0.5]
        candidate_pool_has_new_high_signal: true
      action: rotate_out            # 滞涨换血平仓
      source: 原著
      # ★★ 专家标注「原著写死(Minervini 2017 Ch.6 "Rule of 2-3 Weeks")」。
      #   ★ 查不到。《Think & Trade Like a Champion》Ch.6 是
      #     "How and When to Buy Stocks—Part 1"(买入章),卖出章是 Ch.9;
      #     也没查到书中有叫 "Rule of 2-3 Weeks" 的命名规则。
      #   ★ 见审计报告 §1-C。参数值(15 日 / [−0.3R, +0.5R])不动。
      # ★ 另外「备选池有新高动量信号」没定义:新高是几日新高?动量怎么比?
      #   见审计报告 §2-C。
    - name: 保本
      when: { unrealized_r_gt: 2.0 }
      action: move_stop_to_breakeven
      source: 行业惯例
    - name: EMA10 跟踪
      when: { unrealized_r_gt: 3.0 }
      type: ema_trail
      params: { ema: 10 }
      source: 行业惯例              # +3R 开 EMA10 跟踪
  monotonic_up_only: true
  source: 原著

# ---------------------------------------------------------------------------
# ⑥ 离场
# ---------------------------------------------------------------------------
exit:
  rules:
    - type: close_below_ema
      params: { ema: 10 }
      source: 原著
    - type: close_below_trailing_stop
      source: 原著
  profit_target_r: null            # ★ 创 52 周新高区域绝不设固定止盈
  time_stop_days: null             # 时间维度由 ⑤ 的「滞涨换血」负责
  source: 原著

# ---------------------------------------------------------------------------
# ⑦ 仓位
# ---------------------------------------------------------------------------
sizing:
  type: risk_fraction
  params:
    risk_per_trade: 0.01           # 单笔风险 NAV×1.0%
    max_weight: 0.10               # ★ 单票名义上限 10% NAV(2026-10-28 专家结论,已锁)
  source: 行业惯例
  # ★ 原为 20%。改 10% 的理由与 slots=10 是同一条(长尾遮蔽效应):
  #   10 个槽位 × 10% = 100%,槽位和单票上限必须自洽,
  #   否则 10 个槽位配 20% 上限等于允许 2 只票吃掉全部 NAV。

# ---------------------------------------------------------------------------
# slots / ranking
# ---------------------------------------------------------------------------
slots: 10                          # ★★ 最多同时 10 只(2026-10-28 专家结论,已锁)
source_slots: 行业惯例
# ============================================================================
# ★★ slots = 10 的理由:「长尾遮蔽效应」
#
# 大白话:这类 55 日突破的胜率只有 30–35%,全部的正期望都靠最前面
#   5–8% 的极端大牛股扛着。槽位开得太少,位置会被一堆平庸的试错单占满 ——
#   等真龙头出现的时候,手里已经没有空位了。所以槽位不是「风控松紧」,
#   是「能不能接住那几只决定全局的票」。
#
# 单票名义上限同步定在 10% NAV(见 sizing.max_weight)。
#
# 出处(标注:行业惯例):
#   · Clenow《Stocks on the Move》(2015) Ch.6 —— 用 20 个槽位
#   · Statman (1987, JFQA) —— 12~15 只已吸收 90% 以上的特质风险
#
# ★★ 但三档照样并列报:slots = 3 / 5 / 10 全部列出。
#   理由是我们自己测出来的一个重要事实:★ 上一批证明 slots 会翻结论的符号
#   (流派一 3/5/10 三档分别是 −5.9% / −13.8% / +9.3%)。
#   ★ 结论用 10 档,★ 但三档数字必须并列摆着,不许只报一档。
# ============================================================================

# ---------------------------------------------------------------------------
# 排序(第二轮专家补齐)
# ---------------------------------------------------------------------------
ranking:
  primary:
    formula: D_last = (High_last - Low_last) / High_last
    order: asc                       # ★ 从小到大(最后一段收缩越紧越优先)
    source: 行业惯例
    # ★ 专家标「原著写死」,引语
    #   "The tighter the cheat, the explosive the breakout"(Minervini)。
    # ★★ 这句引语**查不到**,而且英文本身不通顺(the explosive 缺冠词/应为
    #   more explosive)。Minervini 确实用 "cheat"(低位 cheat 买点,源自 Darvas)
    #   也确实主张形态越紧越好,★ 但这句话作为原话核不实。
    # ★ 降级为行业惯例。见审计报告 §5-H。
  tiebreak:
    field: return_60d
    order: desc                      # 过去 60 日总涨幅较高者优先
    source: 行业惯例

# ---------------------------------------------------------------------------
# 摩擦成本与基准
# ---------------------------------------------------------------------------
costs:
  one_way_bps: 5.0
  source: 行业惯例

benchmark:
  component_match: large
  risk_free_annual: null
