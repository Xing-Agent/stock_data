# ============================================================================
# 流派一:系统化中长周期趋势跟随派 · ★ 原著离场 + 原著仓位版
#   (2026-10-31 新建。★ 不覆盖 trend_following.yaml —— 那一份是专家/行业版,
#    它的数是专家给的,一个都没动。)
#
# 三秒版:署名海龟的那条链,离场和仓位本来装的不是海龟。这一份把**自称原著
#         的那三处**改回原著:跌破 20 日最低价就走、不要移动止损、
#         单笔风险 2%(不是 1%)。
#
# ============================================================================
# ★★★ 这一份为什么存在(方法保真度排查 1030 · §二 ①)
#
#   `trend_following.yaml` 的 `meta.master` 写着「Richard Donchian /
#   Curtis Faith(海龟)」,但逐部件对下来,**三个关键部件都不是海龟**,
#   而且这三处的 `source` 全都写着「原著」:
#
#   | 部件 | 它写的 source | 原著(技-1 方法卡 / Faith 2003)| 它实际装的 |
#   |---|---|---|---|
#   | ⑥ 离场     | 原著 | System 2 = **20 日反向通道** | `close_below_ma(50)` ★ 一条唐奇安反向通道都没有 |
#   | ⑤ 移动止损 | 原著 | 原著**没有**移动止损 | 吊灯 3.0×ATR20,浮盈 +2R 启动 |
#   | ⑦ 仓位     | 原著(并自称「已核实」)| 1 单位 = 账户 1%/N,止损 2N ⇒ **单笔风险 2%** | `risk_per_trade: 0.01` = **原著的一半** |
#
#   ★ 仓位那一处是**出处标注错误**,不是参数分歧:原著的「1% 权益」是
#     **单位大小公式的分子**(1 单位 = 账户 1% / N),配上 2N 止损,
#     单笔风险是 2%;而引擎 `risk_per_trade` 的定义是「到止损为止亏多少」。
#     填 0.01 等于只有原著一半的仓位。
#   ★★ 同一条原著规则,`技-1.yaml` 推导**对了**(填 0.02,换算逐字写在 source 里)。
#     两份配置对同一条原著规则给出了相差一倍的实现,其中一份自称「已核实」。
#
#   ★ 离场那一处为什么不能用移动止损顶替(这一点 `技-1.yaml` 做对了,
#     理由写在 `engine/ops_a0.py:336`):引擎的移动止损有「只许单向上移」铁律,
#     而原著的反向通道**可以往下跑** —— 两者不等价。
#     所以反向通道必须写成**离场规则**,不是 stop_trail。
#
# ============================================================================
# ★★★ 这一份**不是**完整的海龟原著 —— 必须先读这一条再读任何结果
#
#   只改了上面那三处「自称原著、其实不是原著」的。下面这些**原样保留**,
#   因为它们本来就标着「行业惯例」= 专家给的数,★ 动它们属于换参数:
#     · ① universe:ADV20 剔后 20% + 价格在 200 日线上(原著**无个股选股条件**)
#     · ② regime:SPY>200 日线×0.99 + 20 日斜率>0(海龟原始规则**无大盘闸**)
#     · ③ entry 的 `atr_squeeze`(原著**没有**波动率挤压条件)
#     · ④ 初始止损的 2.5×ATR20 一端(原著是 2.0N;2.5 查不到谁加的)
#     · ⑦ slots 10 / 单票名义上限 10%(原著是 12 个单位、无名义上限)
#   ★ 所以这一份的名字是「原著离场 + 原著仓位」,★ **不叫「原著版」**。
#   ★ 它的结果**不能当成海龟原版的结论**,只能当成
#     「把那三处装错的改回来,数字会怎么动」。
#
#   ★★ 原著有、引擎做不到的那一条(沿用 技-1-原著 的交代,一字未变):
#     **加仓(金字塔)**:原著「每顺向 0.5N 加 1 个单位,上限 4 个单位,
#     每加一单位把之前所有单位的止损上移到最新成交价下方 2.0N」。
#     引擎一只票只能有一条仓位记录(`chain.py` 的 `pos: dict[int, dict]`)
#     → 本版只跑**单个单位**。★ 没有加仓的海龟不是完整的海龟。
#     ★ 推论:单单位下「灾难防守线 = 最后一次加仓点下方 2.0N」
#       ≡ 进场价 − 2.0N ≡ ④ 那条初始止损,**两条线重合**;
#       加仓一旦能跑,这两条线会分开,**必须重测**。
# ============================================================================

# ---------------------------------------------------------------------------
# ★★★ 出处可对账登记(沿用 trend_following.yaml)
# ---------------------------------------------------------------------------
provenance:
  composite: true              # ★ 合成流派,非单一方法卡
  method_cards: [技-1]         # ★ 本版改回原著的那三处,依据全部来自 技-1 方法卡
  per_rule_cards_filled: false # ★★★ 待填:其余 source:原著 是否已指明来自哪张卡
  本版改回原著的三处:
    - ⑥ 离场:close_below_ma(50) → close_below_lowest_low(20)【技-1 方法卡 ②离场】
    - ⑤ 移动止损:吊灯 3.0×ATR20 → none【技-1 方法卡「原版无移动止损」】
    - ⑦ 仓位:risk_per_trade 0.01 → 0.02【技-1 方法卡 ③仓位,换算见下】

meta:
  name: 流派一_趋势跟随_原著离场与原著仓位
  master: Richard Donchian / Curtis Faith(海龟)
  modern: Andreas Clenow (2013/2015);AQR (Moskowitz/Ooi/Pedersen 2012)
  book: Donchian (1960);Faith《Way of the Turtle》(2007);
        《The Original Turtle Trading Rules》(Faith 2003)
  三版归属: 原著版(离场 + 仓位)
  本轮改了什么: >-
    与 trend_following.yaml 相比只改三处(全部是「自称原著、实际不是原著」的):
    ⑥ 离场换成 20 日唐奇安反向通道、⑤ 移动止损去掉、⑦ 单笔风险 0.01 → 0.02。
    ★ 其余一切(universe / regime / atr_squeeze / 2.5×ATR / slots / max_weight)
    原样保留 —— 它们标的是「行业惯例」,是专家给的数,一个都没动。
  这一版不是什么: >-
    ★ 不是完整的海龟原著。原著无个股选股条件、无大盘闸、无波动率挤压、
    止损是 2.0N、12 个单位且可堆同一品种 —— 这些本版都没有照原著改,
    因为它们属于「专家给的行业数」,改它们是换参数。
  原著有引擎做不到的项:
    - >-
      ★ 加仓(金字塔):每顺向 0.5N 加 1 个单位、上限 4 个单位、
      每加一单位把之前所有单位的止损上移到最新成交价下方 2.0N。
      ★ 引擎一只票只能有一条仓位记录 → 本版只跑单个单位。
    - >-
      ★ 盘中成交:原著盘中突破即成交;引擎只能收盘确认 + 次日开盘。
  caveat: >-
    原著证据来自期货 / 多空 / 跨品种分散;本次跑的是美股个股 / 只做多,
    手册明文「不能搬」。本次结论只对「美股个股只做多」这个口径成立。
  pricing_belief: 收益分布非对称重尾,宏观大资金调仓有物理惯性;截断亏损、让利润奔跑
  best_regime: 宏观单边大牛市、产业主升浪、6 个月以上单边低波推升
  worst_regime: 宽幅震荡、均值回归轮动(2015 全年、2018 前三季)

# ---------------------------------------------------------------------------
# ① 选股范围 —— ★ 原样保留(行业惯例,专家给的数,本版未动)
#    ★ 原著这里是**空的**(海龟无个股选股条件)。保留不是因为它对,
#      是因为动它属于换参数。
# ---------------------------------------------------------------------------
universe:
  rules:
    - type: adv_rank_exclude_bottom
      params: { adv_period: 20, exclude_bottom_pct: 20 }
      source: 行业惯例
      # ★ 原著无个股选股条件 —— 这一条比原著严。本版未动(专家给的数)。
    - type: price_above_ma
      params: { ma: 200 }
      source: 行业惯例
      # ★ 同上,原著无此条。本版未动。

# ---------------------------------------------------------------------------
# ② 环境过滤 —— ★ 原样保留(行业惯例),★ 但块级 source 改掉:见下
# ---------------------------------------------------------------------------
regime:
  rules:
    - type: index_above_ma_scaled
      params: { symbol: SPY, ma: 200, factor: 0.99 }
      source: 行业惯例
    - type: index_ma_slope
      params: { symbol: SPY, ma: 200, lookback: 20, min_slope: 0.0 }
      source: 行业惯例
  flatten_when_off: false
  source: 行业惯例
  # ★★ 块级 source 这里写的是「行业惯例」,不是「原著」——
  #   海龟原始规则里**根本没有大盘闸**,底下逐条也全是「行业惯例」。
  #   ★ trend_following.yaml 的块级写「原著」、逐条写「行业惯例」,
  #     块与条自相矛盾(排查报告 §五 第 11 处)。这一份不复制那个错。

# ---------------------------------------------------------------------------
# ③ 进场扳机 —— ★ 原样保留(55 日突破是原著;atr_squeeze 是行业惯例)
# ---------------------------------------------------------------------------
entry:
  rules:
    - type: donchian_close_breakout
      params: { lookback: 55 }
      source: >-
        原著(Faith 2003《The Original Turtle Trading Rules》):
        System 2 入场 = 55 日通道突破。
        ★ 出处纠正照搬 trend_following.yaml:《Way of the Turtle》Ch.5 不含系统参数,
        该书正文叙述 System 2 时写的是 60 日;55 出自 Faith 2003。参数值不动。
    - type: atr_squeeze
      params: { atr_fast: 10, atr_slow_ma: 50, max_ratio: 0.85, offset_days: 1 }
      source: 行业惯例
      # ★ 原著**没有**波动率挤压条件 —— 这一条比原著严。本版未动(专家给的数)。
  signal_freeze: close
  fill: next_open
  source: 执行细节(原著盘中突破即成交;引擎只能收盘确认次日开盘)

# ---------------------------------------------------------------------------
# ④ 初始止损 —— ★ 原样保留(2.5 那一端是行业惯例,本版未动)
# ---------------------------------------------------------------------------
stop_init:
  type: tightest_of
  components:
    - type: atr_multiple
      params: { atr_period: 20, multiple: 2.5 }
      source: 行业惯例
      # ★ 海龟原版是 2.0N。2.5 不是原著数字,配置自己写「查不到谁加的」。
      #   ★ 本版**不动它** —— 它标的是行业惯例,改它属于换参数。
      #   ★ 代价必须写明:止损比原著远 → 1R 比原著大 → 每笔 R 被压小,
      #     且单笔风险 2% 配 2.5N 止损,股数比原著的 2% 配 2.0N 少。
      #     ★ 所以本版的 ⑦ 仓位是「原著的风险预算」,不是「原著的股数」。
    - type: lowest_low
      params: { lookback: 20 }
      source: 原著
  select: nearest_to_price
  r_definition: abs(entry_price - stop_price)
  source: 行业惯例
  # ★ 块级 source 从「原著」改成「行业惯例」:两条分支里 2.5×ATR 那一条
  #   是行业惯例,整块不能标原著。

# ---------------------------------------------------------------------------
# ⑤ 移动止损 —— ★★★ 改回原著:原著**没有**移动止损
# ---------------------------------------------------------------------------
stop_trail:
  type: none
  source: >-
    原著(海龟无移动止损;★ 留 none 是照原文,不是忘了填)。
    ★★ trend_following.yaml 在这里装的是「浮盈 +2R 启动的吊灯 3.0×ATR20」
    (锁死期 hold_initial_stop + 吊灯期 chandelier 20/3.0/ATR20),
    块级 source 写「原著」—— ★ 原著没有这个东西,吊灯是 LeBeau (1992)。
    ★ 原著的退出靠 ⑥ 的反向通道,而反向通道**可以往下跑**,
    和引擎「只许上移」的移动止损不等价(见 engine/ops_a0.py:336)。

# ---------------------------------------------------------------------------
# ⑥ 离场 —— ★★★ 改回原著:System 2 = 跌破过去 20 日最低价
# ---------------------------------------------------------------------------
exit:
  rules:
    - type: close_below_lowest_low
      params: { lookback: 20 }
      source: >-
        ★★ 原著离场:System 2(55 日入场)退出 = 跌破过去 **20 日最低价**
        全部平仓(技-1 方法卡 ②离场 对照表:「10 日 / 20 日反向通道,
        两套系统各自对应」)。
        ★ 写成**离场规则**而不是移动止损:原著的反向通道可以**往下跑**,
        引擎的移动止损有「只许上移」铁律,两者不等价。
        ★★ trend_following.yaml 这里装的是 `close_below_ma(50)`,
        source 写「原著」—— ★ 一条唐奇安反向通道都没有。
        MA50 在上升趋势里远高于 20 日通道下沿 → 出得比原著早很多(比原著严)。
    - type: close_below_trailing_stop
      source: >-
        原著(2.0N 初始止损照常生效 = 灾难防守线)。
        ★ 本版 ⑤ 是 none,所以这一条判的就是 ④ 那条初始止损。
        ★ 单单位下它 ≡ 原著的灾难防守线(见本文件顶部的推论)。
  profit_target_r: null          # ★ 原著不设止盈
  time_stop_days: null           # ★ 原著未给时间止损 —— 显式不设
  fill: next_open
  source: 原著(海龟不设止盈)

# ---------------------------------------------------------------------------
# ⑦ 仓位 —— ★★★ 改回原著:单笔风险 2%,不是 1%
# ---------------------------------------------------------------------------
sizing:
  type: risk_fraction
  params:
    risk_per_trade: 0.02         # ★★★ 原著换算值(推导见下),不是挑的数
    max_weight: 0.10             # ★ 行业惯例(专家 2026-10-28 结论),本版未动
  source: >-
    原著(推导写明):海龟「1 单位 = 账户 1% / N」,止损在 2N
    → 单笔风险 = 2% 账户。引擎 `risk_per_trade` 的定义是
    「到止损为止亏多少」,所以填 0.02 才等于原著的 1 个单位。
    ★ 不是我们挑的数,是换算出来的 —— 和 技-1.yaml 同一条推导、同一个值。
    ★★ trend_following.yaml 填的 0.01 把「公式的分子」当成了「单笔风险」,
    并自标「原著写死(海龟法则)—— 已核实」,★ 那是出处标注错误:
    填 0.01 等于只有原著一半的仓位。
    ★ 单票名义上限 0.10 是行业惯例(原著无名义上限),本版未动。

# ---------------------------------------------------------------------------
# slots / ranking —— ★ 原样保留(行业惯例,本版未动)
# ---------------------------------------------------------------------------
slots: 10
source_slots: 行业惯例
# ★ 原著是「总持仓上限 12 个单位,单位可堆在同一品种上、最多 4 个」。
#   ★ 本版保留 10 —— 它标的是行业惯例(Clenow 2015 / Statman 1987),
#     是专家给的数,改它属于换参数。
# ★ 代价写明:10 个槽位 = 10 只不同的票,比原著分散,
#   且原著那 12 个单位可以堆在同一只票上 —— 这一处差别由「加仓做不到」负责交代。

ranking:
  primary:
    formula: (Close_t / Close_{t-60} - 1) / ATR_pct_20(t)
    order: desc
    source: 行业惯例
  tiebreak:
    field: adv_20
    order: desc
    source: 行业惯例
  atr_pct_denominator: close_t

# ---------------------------------------------------------------------------
# 摩擦成本与基准 —— 原样
# ---------------------------------------------------------------------------
costs:
  one_way_bps: 5.0
  source: 行业惯例                # SEC Rule 206(4)-1(d);GIPS 2020 Section 2.A

benchmark:
  family: trend
  component_match: large
  risk_free_annual: null
