# ============================================================================
# 模-6 · 空头拥挤度(辅助条件,不可单独使用)  ★★ 拿不到数据 —— 不建链
#
# 三秒版:很多人做空同一只票、而价格开始往上走时,上涨会被强制平仓放大。
#         ★ 我们的仓库里**没有任何卖空数据**,这条一个字段都算不出来。
#
# ★★ 手册要的三个输入,逐个核对过:
#   · 卖空比例(short interest / float)      → ★ 仓库里没有
#   · 空头回补所需天数(days to cover)       → ★ 仓库里没有
#   · 正向催化剂 / 放量突破                   → 放量能算,催化剂没有事件数据
#
#   仓库里有什么:日线 OHLCV(pilot_300/*/daily.json)+ SEC 基本面
#   (fundamentals.json,18 个 us-gaap 标签)。★ 卖空数据是交易所/FINRA
#   双月报口径,既不在 Alpha Vantage 的日线里,也不在 SEC CompanyFacts 里。
#   README 列的 18 个标签里没有任何一个和卖空有关。
#
# ★ 没有用近似值顶上:
#   ★ 不用「换手率」当卖空比例的代理 —— 那是两件事,高换手既可以是空头也可以是多头。
#   ★ 不用「下跌放量」当空头拥挤 —— 那是我们自己编的因子,不是模-6。
#
# ★★ 另外:即使拿到数据,手册对这条的定位也必须照抄进产品:
#   「在美股上,高卖空比例在学术研究里是收益的**负向**预测指标 ——
#     空头平均而言是有信息的一方。少数挤压行情是尾部事件。」
#   「默认关闭,只能作为辅助条件挂载,界面上必须显示上面那条负向证据。」
#   「不允许它单独触发提示。它永远是别的信号旁边的一行注解。」
