# ============================================================================
# 大师链配置模板 —— 照着改就能加一条新链,不用写任何代码。
#
# 三秒版:一个大师 = 一份这样的 YAML。七步各填一块,跑
#   python -m engine.chain engine/configs/你的文件.yaml
# 就出完整结果(绝对表现 / 两条基准线 / 代价 / 执行负荷 / 扣摩擦净收益 / 五行归因)。
#
# 为什么是七步而不是「一个进场条件」:实测下来进场扳机只占价值的 5%,
# 选股范围和环境过滤占 70%,出场和风控占 25%。只测扳机等于只测那 5%。
#
# ★ 硬规矩:每一块只要写了 params,就必须同时写 source(参数出处)。
#   少了 source 配置直接加载失败 —— 参数只能来自原著或行业惯例,
#   不许网格搜索调出来。
# ============================================================================

meta:
  name: 示例_海龟式突破            # 结果报表上显示的名字
  master: Richard Dennis / Turtle  # 这条链还原的是谁
  book: 《The Original Turtle Trading Rules》(Faith 2003 整理)
  note: 这是模板,照抄前请逐块确认参数出处

# ---------------------------------------------------------------------------
# ① 选股范围 —— 在哪些票里找
#    留空 = 全池。填了就只在符合条件的票里找。
# ---------------------------------------------------------------------------
universe:
  size_groups: [large, mid]        # large / mid / small,可多选;不写 = 全部
  sectors: null                    # 例:[Technology, Healthcare];不写 = 全部
  min_price: 5.0                   # 股价下限,滤掉仙股
  min_dollar_volume: 5.0e6         # 近 63 日成交额中位数下限(流动性闸门)
  dollar_volume_period: 63
  fundamental_gates:               # 基本面闸门,★ 严格 PIT(只看当天 SEC 已受理的版本)
    - { metric: Revenue, op: ge, value: 1.0e8 }
    # 可用 metric:Revenue / CostOfRevenue / EBIT / NetIncome / DilutedEPS /
    #              CurrentAssets / CurrentLiabilities / LongTermDebt
    # op:ge / le / gt / lt。★ 看不到数据的那天算「不合格」,不猜不补。

# ---------------------------------------------------------------------------
# ② 环境过滤 —— 什么时候整个不做
#    所有规则都成立才算「可以做」。空列表 = 永不关闸。
# ---------------------------------------------------------------------------
regime:
  rules:
    - { type: index_above_ma, symbol: SPY, ma: 200 }          # 大盘在 200 日均线上方
    - { type: breadth_above, field: pct_above_ma200, value: 40 }  # 四成以上个股在 200 日均线上
    # - { type: vix_below, value: 30 }
  flatten_when_off: true           # 关闸时清空持仓(次日开盘);false = 只停新开仓
  source: 趋势跟踪通用做法;breadth 字段见 pilot_300/breadth_top500.csv 表头

# ---------------------------------------------------------------------------
# ③ 进场扳机 —— 什么时候买(只占价值的 5%,别在这里花太多功夫)
# ---------------------------------------------------------------------------
entry:
  type: donchian_breakout          # 收盘突破前 N 日最高
  params: { lookback: 20 }
  source: Donchian 四周法则;海龟系统 System 1 用 20 日(Faith 2003)
  # 其他可选:
  #   ma_cross      params: {fast: 50, slow: 200}
  #   rsi_oversold  params: {period: 14, threshold: 30}     Wilder (1978)
  #   roc_momentum  params: {lookback: 126, self_quantile: 0.8, rank_window: 252}
  #   always / never / random(后两个给归因和基准一用,正式链别用)

# ---------------------------------------------------------------------------
# ④ 初始止损 —— 第一道止损放哪(进场当时就定死,它同时决定仓位大小)
# ---------------------------------------------------------------------------
initial_stop:
  type: atr_multiple               # 进场价 − 倍数 × ATR
  params: { atr_period: 20, multiple: 2.0 }
  source: 海龟系统 2N 止损,N = 20 日 ATR(Faith 2003);ATR 定义见 Wilder (1978)
  # 其他可选:pct params:{pct: 0.10} / chandelier

# ---------------------------------------------------------------------------
# ⑤ 移动止损 —— 持仓中怎么抬
#    ★★ 吊灯止损有两条铁律,引擎里强制执行,配置改不动:
#       一、止损价不能高于当根收盘价
#       二、只能往上抬,不许下移
#    这个 bug 两天内被三个人独立踩到。征兆:胜率 >60% 或每笔 >+0.5R。
#    跑出这种数先停下来检查,不要往下跑。
# ---------------------------------------------------------------------------
trailing_stop:
  type: chandelier                 # 近 N 日最高价 − 倍数 × ATR
  params: { lookback: 22, multiple: 3.0, atr_period: 20 }
  source: Chuck LeBeau 吊灯出场;见 LeBeau & Lucas (1992) Computer Analysis
          of the Futures Markets
  # 其他可选:none

# ---------------------------------------------------------------------------
# ★★ 加仓(add_on)—— 2026-10-30 新增的第八个槽位
#
# 三秒版:原来模板**没有这一格**,所以 67 条策略里一条都不可能有加仓 ——
#         不是漏装了,是装不了。现在这一格在了。
#
# ★★ 三种状态必须能区分开:
#     有值     : type: <某个值> + params + source
#     明确为无 : type: none + ★ 必须有 source(样板见 技-12.yaml 的 initial_stop)
#     空着     : ★ 整个槽位不要写(原著没说 / 我们没定)
#   ★ 半个槽位(写了 type 却没 params / 写了 none 却没 source)是最坏的那一种 ——
#     schema 会报错,因为它和「忘了写」长得一模一样。
#
# ★★ 默认只许**顺势**加仓。逆势加仓(= 向下摊平)★ 在 schema 层没有这个选项,
#   写了就报错,不是警告。理由:向下摊平让**正在亏**的仓位变大,赌它会回来;
#   不回来损失翻倍。原著里几乎每位趋势/动量作者都明确反对。
#   ★ 禁令做在 schema 上、不挂在欧奈尔(技-4)名下 ——
#     挂一个人名下,用户换条策略就以为不适用。
#   ★ 真正堵死它的不是类型名黑名单(名字能改),是 min_unrealized_r 的**符号**:
#     写一个负数进去 = 数学上就是向下摊平 → 报错。
#
# ★★ 均值回归类(benchmark.family: meanrev)★ 不给这个槽位 —— 写了就报错。
#   Connors / 拉什克 / 狄马克 / 布林格 的原著都明确反对加仓:
#   均值回归是在赌「偏离会收回」,偏离越大越该怀疑前提、不是越该加注。
#
# 规则与校验:engine/addon_slot.py  /  闸:engine/checks/addon_schema.py
# ---------------------------------------------------------------------------
# add_on:
#   type: atr_step_pyramid         # 认得的:breakout_pyramid / atr_step_pyramid
#                                  #          r_step_pyramid / trend_confirm_add / none
#   params:
#     direction: with_trend        # ★ 只许 with_trend;counter_trend 直接报错
#     min_unrealized_r: 0.5        # ★ 必须显式写,且 ★ 不许为负(负 = 向下摊平)
#     step_atr: 0.5                # 每涨 0.5 × ATR 加一份
#     max_units: 4                 # ★ 必须写:没有上限的金字塔 = 仓位可无限放大
#   source: 原著(海龟交易法则:每涨 1/2 N 加一份,最多 4 份)
#
# ★★ R 的分母不受加仓影响 —— 这一条写死,不许再改:
#       1R = |Entry₁ − InitialStop₁| × Shares₁
#       Final R = [ Σ(Exit_i − Entry_i) × Shares_i − 总费用 ] / 1R_initial
#   ★ 两条理由,第二条是纯数学:
#     ① 分母随加仓放大 → 一笔顺风暴赚的交易 +12R 被稀释成 +4R
#        (量错的正好是趋势跟随唯一重要的那几笔)
#     ② ★ 止损抬到保本以上 → 账面名义风险 = 0 → 分母除以 0 → 公式崩溃。
#        ★ 而我们几乎每条链的 ⑤ 里都有「保本」那一级 → 这不是可能,是必然。
#   闸:engine/checks/r_denominator_lock.py

# ---------------------------------------------------------------------------
# ⑥ 离场 —— 止盈 / 时间止损(跟踪止损触发由 ⑤ 负责)
#    两个都填 null = 只靠止损出场(趋势跟踪的标准做法)
# ---------------------------------------------------------------------------
exit:
  type: signal_only
  params:
    profit_target_r: null          # 例:3.0 = 赚到 3 个 R 就走
    time_stop_days: null           # 例:60 = 拿满 60 个交易日还没动静就走
  source: 趋势跟踪原著不设固定止盈,交给移动止损

# ---------------------------------------------------------------------------
# ⑦ 仓位 —— 每笔冒多少风险
# ---------------------------------------------------------------------------
sizing:
  type: risk_fraction              # 每笔冒总权益的固定比例,按止损距离换算股数
  params:
    risk_per_trade: 0.01           # 每笔冒 1% 权益
    max_positions: 10              # 最多同时持 10 只
    max_weight: 0.10               # 单只仓位市值上限 10%
  source: 固定分数法 1%;海龟原著每单位 1%(Faith 2003)
  # 其他可选:fixed_fraction(每只固定权重) / equal_weight_all(等权买入持有,归因中间行用)

# ---------------------------------------------------------------------------
# 摩擦成本 —— ★ 按 ADV20 分三档,不一刀切
#   为什么不一刀切:统一扣固定摩擦会系统性美化高频、惩罚低频。
#   高流动性 = 当日 ADV20 排全池前 1/3,中间 1/3,后 1/3 分别给不同单边成本。
#   ★ 具体数值定不下来,所以做成配置项,并由执行器自动同时报
#     0.05% / 0.15% / 0.30% 三档一刀切下的结果(敏感度)—— 不许自己挑好看的。
#   想改成一刀切(只在对数/基线链用):删掉 friction_tiers,写 one_way_bps: 5.0
# 出处:SEC Rule 206(4)-1(d);GIPS 2020 Section 2.A
# ---------------------------------------------------------------------------
costs:
  friction_tiers:
    high_liquidity_bps: 5.0
    mid_liquidity_bps: 15.0
    low_liquidity_bps: 30.0

# ---------------------------------------------------------------------------
# 基准(基准二「同等仓位大盘」用)
#   成分匹配:大盘股→large(SPY) · 中盘→mid(MDY) · 等权→equal_weight(RSP)
#            单行业→直接写板块 ETF 代码,如 XLK
#   ★ 仓库里目前没有 MDY。写 mid 会直接报错,不会悄悄用别的指数顶上。
#   ★ risk_free_annual 留 null:仓库没有短端利率序列,现金腿按 0% 记并在结果里标明。
# ---------------------------------------------------------------------------
benchmark:
  component_match: large
  risk_free_annual: null
