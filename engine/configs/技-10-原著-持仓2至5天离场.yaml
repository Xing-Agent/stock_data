# ============================================================================
# 技-10 · 海龟汤 · ★ 原著离场版(2026-10-29 新建,★ 不覆盖 技-10.yaml)
#
# 三秒版:价格刚创 20 日新低就被拉回去 → 反手做多;
#         ★ 原著是**拿 2 到 5 天就获利离场**,不是拿着不动。
#
# ★★ 为什么要有这一版:
#   旧配置 技-10.yaml 的 exit 显式写着「原著的离场整条拿掉了」,
#   实测平均持仓 148~160 个交易日 —— ★ 而原著意图是 2~5 天。
#   这一版把那条离场装上。
#
# ★★ 本版装了什么(两处,都来自原著写死的文字):
#   一、初始止损:买入后挂在**当日创出的新 20 日最低价下方 1 tick**。
#       ★ 旧配置写的是「『一点点』原著没给数 → 用 0 缓冲」;
#         本轮任务书明确「下方 1 tick(原著写死)」→ 改成 −$0.01。
#   二、离场:**持仓 2~5 天获利离场**。
#       ★ 原著给的是**区间**,不是一个数 → 按硬纪律第 2 条跑三组:
#         2 天(严格端)/ 3 天(中值)/ 5 天(宽松端)。
#         本文件是 2 天那一档,3 / 5 由 runner 覆盖 exit.params.time_stop_days。
#
# ★★ 本版**明确没有装**什么(不许偷偷补):
#   ★ 原著没有给出具体的移动止损点 → **不设移动止损**。
#     任务书原话:「不要自己补一个移动止损当作原著」。
#   ★ 「原著未给出可执行阈值」这件事本身就是产出,记在 meta 里由 runner 收集。
# ============================================================================

meta:
  name: 技-10_海龟汤_原著离场_持仓2天
  master: Linda Raschke / Victor Sperandeo
  book: Connors & Raschke《Street Smarts》(1996) Ch.4 Turtle Soup
  三版归属: 原著版(离场)
  orig_claim: 规则来自原著。计划止损距离小,但实际损失受跳空、流动性与成交影响
  原著未给出可执行阈值的项:
    - >-
      ★ 移动止损点:原著只说「持仓 2~5 天获利离场」,**没有给出具体的移动止损点**。
      → 本版显式不设移动止损(trailing_stop: none),★ 不自己补一个当原著。
    - >-
      ★ 「大牛市主升浪禁用」开关:原著有,但它依赖 状-1 的摆动点定义,
      而 状-1 的 ZigZag 阈值在附录 D.8 里是「待校准」→ 接不上,本版没装。
      ★ 不是忽略。
    - >-
      ★ 仓位与槽位规则:原著没给(Street Smarts 是单品种短线书)。
      本版沿用全仓库统一口径(1% 固定分数 / 10 槽 / 单票 10%),★ 都不是原著的数。
  本轮改了什么: >-
    只改第 ④ 步止损缓冲(0 → 1 tick)和第 ⑥ 步离场(无 → 时间止损 2/3/5 天)。
    ①②③⑦ 与 技-10.yaml 逐字相同 —— ★ 这样两版之差只有离场。
  caveat: >-
    ★ require_close_confirm 本版固定为 true(= 我方卡片口径),
    和上一轮那条 123 笔的链同一口径 —— ★ 这样「装上离场前后」才是严格的 A/B。
    附录 D.8 猜测的「原著不要求收盘确认」这一轴本轮**不动**,
    否则就分不清变化是离场带来的还是收盘确认带来的。

universe:
  rules: []
  source: 原著(无选股条件)

regime:
  rules: []
  flatten_when_off: false
  source: >-
    ★ 原著有禁用条件(大牛市主升浪),但它要 状-1 的摆动点定义,
    而 状-1 的阈值在附录 D.8 里是待校准 —— 接不上,所以本次没装。★ 不是忽略。

entry:
  rules:
    - type: turtle_soup
      params:
        lookback: 20
        min_bars_before: 4
        require_close_confirm: true
      source: >-
        原著:20 日新低;前低至少 4 个交易日之前
        (Ch.4 Rule 2,原文 "must have occurred at least four trading
        sessions earlier",ops_1029 已核实)。
        ★ require_close_confirm 固定 true(我方卡片口径),本轮不动这一轴。
  signal_freeze: close
  fill: next_open
  source: >-
    执行细节:原著是「第二天价格越过前一天高点」时盘中挂 stop order 成交;
    引擎只能「次日收盘站上前一天高点 → 第三天开盘成交」。★ 比原著晚一天。

# ============================================================================
# ④ 初始止损 = 新 20 日最低价下方 1 tick(★ 原著写死)
# ============================================================================
initial_stop:
  type: day_low_minus_tick
  params:
    structure_lookback: 3
    tick: 0.01
  source: >-
    原著:「买入后挂在当日创出的新 20 日最低价下方 1 tick」。
    ★ 1 tick = $0.01(美股最小报价单位)—— 这是执行细节的落地,
      「1 tick」本身是原著写死的。
    ★ structure_lookback: 3 = 回看 3 根取最低,覆盖「假突破那根 + 确认那根 +
      进场那根」。引擎的执行比原著晚一天,进场日已经离假突破那根 2 根了。
      ★ 这个 3 与 技-10.yaml 逐字相同 —— 本轮在止损上唯一的改动是那 1 tick。

trailing_stop:
  type: none
  source: >-
    ★ 原著**没有给出具体的移动止损点** —— 显式写 none。
    ★ 不许自己补一个移动止损当作原著(任务书明文)。

# ============================================================================
# ⑥ 离场 = 持仓 2~5 天获利离场(★ 原著区间 → 三组并跑)
# ============================================================================
exit:
  rules:
    - type: time_stop
      params:
        max_holding_days: 2
      source: >-
        原著:「持仓 2~5 天获利离场」。★ 这是一个**区间**,不是一个数 ——
        按硬纪律第 2 条跑三组:2 天(严格端)/ 3 天(中值)/ 5 天(宽松端)。
        ★ 本文件是 2 天那一档;3 / 5 由 runner 覆盖 exit.params.time_stop_days,
          覆盖后 meta.name 一并改掉,报告里三组并列。
        ★ 引擎口径:持仓满 N 天的那根收盘触发、次日开盘平仓
          → 实测 holding_days ≈ N+1。这一点在报告里标明,不含糊。
    - type: close_below_trailing_stop
      source: 原著(跌破新低下方 1 tick 的止损就斩)
  params:
    profit_target_r: null       # ★ 原著「箱体另一端」—— 箱体没定义,显式不设
  fill: next_open
  source: >-
    ★ 原著的离场有两句:「目标位是箱体的另一端」和「几天内的均值回归」。
    前一句的「箱体」原著没定义 → 显式不设止盈;
    后一句的「几天」任务书给到了 2~5 天 → 装成时间止损,三组并跑。

sizing:
  type: risk_fraction
  params:
    risk_per_trade: 0.01
    max_positions: 10
    max_weight: 0.10
  source: >-
    ★ 执行细节:原著没给仓位规则。1% 固定分数法是行业惯例;
    槽位 10 / 单票 10% 与别的链保持一致,★ 都不是原著的数。
    ★ 与 技-10.yaml 逐字相同,保持可比。

slots: 10
source_slots: 执行细节(原著无仓位与槽位规则)

ranking:
  primary:
    formula: ADV20
    order: desc
    source: 执行细节(原著无排序)

costs:
  one_way_bps: 5.0
  source: 行业惯例(SEC Rule 206(4)-1(d);GIPS 2020 Section 2.A)

benchmark:
  # ★ 均值回归类 → 双轨基准,不用单边多头指数(硬纪律第 7 条)
  family: meanrev
  component_match: large
  risk_free_annual: null
