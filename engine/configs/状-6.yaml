# ============================================================================
# 状-6 · 共振计数(综合)  ★ 状态判定 —— 不产生交易信号
#
# 三秒版:一个价位上,有多少个独立来源同时指向它。0 到 6 的整数。
#         ★ 不跑回测,只出 0-6 的分布 —— 校准目标是「平均共振强度不应普遍 ≥ 4」。
#
# ★ 校准目标出处:手册第 465 行(状-6 自己的「什么时候不可靠」)+ 附录 D.9 验证一。
#   手册原文:「容差决定一切。容差放大则所有价位都『共振』,这个指标就失去区分度。
#            校准目标:平均共振强度不应普遍 ≥ 4。」
#
# ★ 六类来源(手册原文):成交密集区 / 前高前低 / 均线 / 整数关口 /
#                        斐波那契回撤 / 状态匹配的背离
# ★ 手册给死的参数:均线取 20 / 50 / 150 / 200 日;斐波那契取 0.382 / 0.5 / 0.618;
#                   背离用 MACD 12/26/9;背离条件化(上涨只计底背离、下跌只计顶背离、
#                   震荡两者都计、过渡或混合两者都不计)
#
# ★★ 四处「手册没写死」—— 已列入报告「要回去问」:
#
#   一、**容差 ±0.5 × ATR(14) 在附录 D.8 里就是「待校准」**。
#      ★ 这是本条的核心参数,手册自己说「容差决定一切」,又把它列为待校准 ——
#        所以状-6 从定义上就不该被归进「原著完整、不需要补阈值」。
#      ★ 本次跑 0.25 / 0.5 / 1.0 三档容差,让「容差决定一切」这句话量化出来。
#
#   二、**「成交密集区」没有定义**。用什么口径?日线只有「当日总量」,
#      没有价位分布(volume-at-price 要日内或逐笔)。
#      ★ 本次用「按日线收盘价分箱累加成交量,取量最大的前若干个箱」的读法,
#        ★ 箱宽和「前若干个」都是我们定的 —— 不是原著。
#
#   三、**「整数关口」的粒度没给**。$10 / $5 / $1 / 还是按价格量级分级?
#      ★ 本次用「按价格量级取一位有效数字的整数」的读法,★ 也是我们定的。
#
#   四、**斐波那契从哪一段摆动算,没给**。它依赖 状-1 的摆动点,
#      而 状-1 的参数和「取影线还是收盘」在附录 D.8 里都是待校准。
#
# ★ 手册锁死的两条,本次已遵守:
#   · 不说这个价位会守住(共振的机制是「被多少人看见」,不是「这里有多强的支撑」)
#   · 背离只能是共振计数的一个来源,不是独立触发器
# ★ 附录 D.6 的护栏也遵守:不加任何指数衰减的「新鲜度权重」——
#   共振计数必须保持 0-6 的整数、可数可追溯。改为另出一列事实
#   level_last_touched_bars(价位最后一次被触及的 K 线数)。
# ============================================================================

