# ============================================================================
# 模-5 · R 乘数(范·撒普)  ★ 可挂载模块 —— 不单独建链
#
# 三秒版:不用「赚了多少钱」记账,用「赚了几倍的风险」记账。
#         1R = 进场价到止损价的距离 × 股数。
#
# ★★ 这条是 12 条里唯一「引擎里已经原生实现、不需要挂也在跑」的。
#   engine/chain.py 的交易流水里本来就有三列:
#       risk_per_share = abs(entry_price − initial_stop)
#       r_multiple     = (exit_price − entry_price) / risk_per_share
#       r_multiple_net = 扣掉双边摩擦之后的 R
#
# ★★ 手册的那条「必须写死的技术细节」已经满足并已实测核对:
#   「原始 R(进场时确定的那个)必须留档,不得随移动止损重写分母 ——
#     否则事后看所有交易的 R 都会变好看。」
#   → chain.py 用的是 p["init_stop"](进场当时定死的),不是 p["stop"](被抬过的)。
#   → 本次已在 技-1 的 547 笔流水上逐笔核对:
#     abs(entry_price − initial_stop) == risk_per_share 全部成立。
#
# ★ 手册的 v8 三条修正也落实在报告口径里:
#   ① R 让不同仓位的结果可比,但它仍然是**结果指标**,不是决策质量的度量
#   ② 显示时必须标样本量,并说明「这是观察到的平均,不是预期」
#   ③ 必须并列展示五个:R / 账户收益 / 回撤 / 持有时间 / 纪律记录
#
# ★ 一处必须写明的代价:initial_stop: none 的链(技-2 法伯、技-12 康纳斯)
#   1R = 进场价,R 退化成收益率。★ 这两条链的「每笔 R」不能和有止损的链比。
# ============================================================================

