# ============================================================================
# 流派三:微观结构流动性猎杀与均值回归派
#
# 三秒版:等算法把散户止损点砸穿、当天又拉回来收阳线,就在那根针上接一手;
#         止损贴死针尖下方,站上 20 日线后移保本,绝不半仓止盈。
#
# ★ 本文件是「照抄外部专家原文」的产物。所有数值与专家原文一字不差。
# ★ source 字段约定(三选一):原著 / 行业惯例 / 我们搜的
#   ★ 本文件 "我们搜的" = 0 条。
# ★★ 第二轮更新(1028 晚):专家补齐了「强力收复」的两个死数、成交时点、
#   排序规则、止盈封顶,并把信用利差闸门改成 HYG/LQD 比价。
#   ★ 但 ① HYG/LQD 我们**还是没有**(闸门关着 + 用专家给的代偿方案);
#     ② 摆动波谷定义、成本区定义、ADV 窗口、HV 口径、Z'' 版本
#        这 5 处**第二轮仍未答**,仍留空。
#   ★★ 所以这条链**现在仍然跑不起来**(摆动波谷没定义就没有进场信号)。
#   ★ 第二轮出处标注又有 2 处核不实,已降级。见审计报告第五节。
# ★★ 提醒:外部专家自己承认,裸测纯几何日线 U&R 的经验显著性 p ≈ 0.12
#   —— 这条链的实证等级最低,优先级应排最后。
#
# 审计报告:/home/claude/三流派配置-参数审计-1028.md
# 字段命名按七步接口,与现有 _TEMPLATE_master.yaml 不一致,见 §4-A。
# ============================================================================

meta:
  name: 流派三_微观结构流动性猎杀与均值回归
  master: Richard Wyckoff;Connors & Raschke;Victor Sperandeo
  modern: ICT / Smart Money Concepts(SFP);Toby Crabel (1990)
  book: Wyckoff《The Wyckoff Method》(1931) 第 7 节(Springs / Shakeouts);
        Connors & Raschke《Street Smarts》(1995) Ch.3(Turtle Soup);
        Sperandeo《Trader Vic》(1991) Ch.7(2B 假突破反转)
  # ★ 三处书目定位都核不实,见审计报告 §1-I。
  pricing_belief: 算法做市商定点击穿散户密集设伏的支撑点触发止损盘;
                  极端放量刺穿后快速拉回收复 = 空头动能耗尽 + 做市商吸筹 → 向中枢回归
  best_regime: 宽幅箱体震荡、长期牛市中的次级恐慌回踩、白马股支撑位被点刺后的诱空反转
  worst_regime: 系统性信用危机去杠杆(2008 雷曼周、2020 年 3 月)、
                个股造假或模式破裂的真破位
  evidence_grade: 中等 —— 订单簿与反转文献充分,但纯日线几何规则 Alpha 衰减显著;
                  ★ 专家自承裸测 p ≈ 0.12
                  (Biais/Hillion/Spatt 1995 JF;Hendershott/Jones/Menkveld 2011 JF;
                   Lehmann 1990 QJE)
  # ★ 数据从 2016-01-01 起,2008 雷曼周这段「必然失灵」样本测不到;
  #   2020 年 3 月在样本内 —— 见审计报告 §3-F。

# ---------------------------------------------------------------------------
# ① 选股范围 → [日期 × 票] 的 0/1 矩阵
# ---------------------------------------------------------------------------
universe:
  rules:
    - type: dollar_volume_rank_exclude_bottom
      params: { exclude_bottom_pct: 20 }
      source: 行业惯例
      # ★ 原文「剔除成交额后 20%」没给计算窗口(ADV 几日?中位数还是均值?)
      #   —— 流派一同类条件写的是 ADV20,这里没写。
      #   ★ 第二轮仍未答。见审计报告 §2-H。★ 没有自己填窗口。
      # ★ 口径:池内后 20% ≠ 全市场后 20%,见审计报告 §3-A
      #   (待 Lin 确认 #1,此处按我的倾向「照原数跑、结果里标明闸门没在干活」)。
      pending_lin: "#1 分位口径 —— 按 Claude 倾向照原数跑池内分位,待 Lin 确认"
    - type: hv_below
      params: { period: 20, max_hv_annualized_pct: 40 }
      source: 行业惯例
      # 原文:HV20 < 40%(严禁在高波动暴雷股上接飞刀)
      # ★ 原文没说 HV 是年化还是日化、用对数收益还是简单收益、
      #   年化按 252 还是 260 天 —— 40% 这个数只有在年化口径下才讲得通,
      #   这里按年化写,但口径须专家确认。见审计报告 §2-I。
    - type: altman_z_double_prime_exclude_bottom
      params: { exclude_bottom_pct: 10 }
      source: 行业惯例
      # 原文:Altman Z'' 不在后 10% 破产危险区
      # ★ 数据上算得出来(TotalAssets / CurrentAssets / CurrentLiabilities /
      #   RetainedEarnings / EBIT / StockholdersEquity / Liabilities 都有,且 PIT),
      #   但原文没指定 Z'' 的系数版本(Altman 1995 新兴市场版有多个变体)。
      #   ★ 另外「后 10%」又是池内 300 只的后 10%,不是全市场。
      #   见审计报告 §3-D 与 §2-J。

# ---------------------------------------------------------------------------
# ② 环境过滤 → [日期] 的 0/1 向量
# ---------------------------------------------------------------------------
regime:
  rules:
    - type: no_large_down_day
      params: { symbol: SPY, window: 3, single_day_drop_pct: 2.0 }
      source: 行业惯例
      # 原文:SPY 过去 3 日内无单日跌幅 > 2.0%
    # --- 信用利差闸门:第二轮专家改用 HYG/LQD 比价代替 HY OAS ---
    - type: credit_ratio_gate
      params:
        numerator: HYG
        denominator: LQD
        ratio: Ratio_t = HYG_t / LQD_t
        change_formula: ΔCredit_t = (Ratio_t - Ratio_{t-5}) / Ratio_{t-5}
        gate_off_threshold: -0.0150   # ΔCredit_t ≤ −1.50% → GATE_OFF(禁止开仓)
      source: 行业惯例
      data_missing: true
      enabled: false
      audit_blocked: §3-E
      # ★★★ 规则照写,但 ★ 我们仓库里没有 HYG,也没有 LQD。已实地核查:
      #     benchmarks/ 只有 SPY · IWM · IVE · IVW · TLT · VIX;
      #     reference_etfs_20261025/ 只有 RSP + 11 只 XL* 行业 ETF。
      #   ★ 坑:pilot_300/selection/metadata/HY.json 是 Hyster-Yale 这只**股票**
      #     的公司资料,不是 high-yield 利差 —— 名字撞车,别误用。
      #   ★ 协调人已去要 HYG / LQD 这两只 ETF。要到之前这道闸门关着。

      # ★★ 关掉期间的代偿方案(第二轮专家给的,★ 已在 sizing 里生效):
      #   ① 单笔风险从 1.0% 降到 0.5%
      #   ② 最大回撤容忍度调高 40%
      compensation_when_disabled:
        risk_per_trade: 0.005          # 1.0% → 0.5%
        max_drawdown_tolerance_multiplier: 1.40
        source: 行业惯例

      # ★★★ 结果必须标明:「缺一道闸门,这不是完整的这一派」。
      #   理由:专家自承裸测(不配大盘环境和基本面排雷)p ≈ 0.12,
      #   而这道闸门正是那个「大盘环境排雷」的一半。
  flatten_when_off: false
  source: 原著

# ---------------------------------------------------------------------------
# ③ 进场扳机 → [日期 × 票] 的布尔矩阵
# ---------------------------------------------------------------------------
entry:
  rules:
    - type: swing_low_exists
      params:
        lookback: 20
        swing_definition: null       # 「清晰摆动波谷」未定义
        min_bars_before: null        # 波谷距今至少几根 K 线未给
      source: 原著
      audit_blocked: §2-K
      # ★★★ 第二轮**仍未答**,这条链卡在这里跑不起来:
      #   ① 「摆动波谷」怎么认?(左右各几根 K 线更高就算一个波谷?)
      #   ② 「清晰」是什么门槛?(波谷相对周边要深多少?)
      #   ③ 波谷离当天至少隔几天?★ Connors 原版 Turtle Soup 明确要求
      #     那个 20 日新低发生在至少 4 个交易日之前 —— 原文把这条丢了。
      # ★★ 注意:专家在第二轮给流派二定义了「5 根 Bar 局部极值分型(2-1-2
      #   Fractal)」,★ 这套分型**看上去正好能用来定义这里的摆动波谷**,
      #   ★ 但他是明确给流派二 VCP 波段切分用的,★ 没说流派三也用这套。
      #   ★ 我没有自己搬过来 —— 搬了就是我们替他定参数。
      #   ★ 这是第二轮追问里最该问的一句,见审计报告 §5-K。
    - type: intraday_break_below_swing_low
      params: { min_new_low_days: 20 }
      source: 原著
      # 原文:当日盘中跌破该波谷、创至少 20 日新低
    # --- 「强力收复」:第二轮专家给齐,★ 两个条件同时满足(AND)---
    - type: close_reclaim_above_swing_low
      logic: AND
      components:
        - name: 绝对收复缓冲垫
          formula: Close_t >= SwingLow_20 + 0.15 * ATR14(t)
          params: { atr_period: 14, atr_multiple: 0.15 }
          source: 行业惯例
        - name: BCL_K线内收盘相对位置
          formula: (Close - Low) / (High - Low) >= 0.65
          params: { min_bcl: 0.65 }
          source: 微观执行台形态收盘过滤参数
          # ============================================================
          # ★★ 2026-10-28 修正:出处改掉,★ 数值 0.65 不动。
          #   ★★ 严禁标 Sperandeo —— 专家已书面承认那本书里没有这条。
          #   ★ 新出处:微观执行台形态收盘过滤参数
          #     (= 交易台自己用来过滤「收盘站不站得住」的工程参数,
          #       ★ 不是任何人的原著,引用时不许当成有书可查。)
          # ============================================================
          source: 行业惯例
          # ★ 即收盘必须落在当日振幅的上三分之一。
          # ★★ 专家标「原著写死(Sperandeo 1991 2B 规则核心定义)」。
          #   ★ 核查结果:Sperandeo 的 2B 规则是**定性描述** ——
          #     「创新高后未能延续、随后跌回前高之下」,配的是
          #     「通常 1 天内 / 3~5 天 / 7~10 天内破」这类定性时间窗,
          #     ★ 全文没有任何「收盘在当日振幅什么位置」的条件,
          #     ★ 更没有 0.65 这个数。(2B 的量化阈值出自 Bulkowski 的研究,
          #       而且是「第二个峰在第一个峰 5% 以内」这类,与 BCL 无关。)
          #   ★★ 协调人的怀疑成立:0.65 是专家自己加的。
          #   ★ 降级为行业惯例。见审计报告 §5-I。
      source: 行业惯例

    - type: bullish_candle
      params: { require: close_gt_open }
      source: 原著                   # 收阳线(收 > 开)
  signal_freeze: close
  fill: next_open_market           # ★ 第二轮:彻底删除「当日收盘入场」
  source: 行业惯例
  # ★★ 专家采纳了我们的意见,理由(他的原话方向与我们一致):
  #   判定条件包含 BCL 和收盘价,必须等收盘集合竞价完成才算得出来;
  #   而美股 MOC 订单要在 15:50 前提交 ——
  #   ★ 在日线模型里假设能以当日 Close 成交 = 回测作弊。
  # ★ 这条澄清把 §2-M 关掉了。

# ---------------------------------------------------------------------------
# ④ 初始止损
# ---------------------------------------------------------------------------
stop_init:
  type: day_low_minus_atr
  params:
    atr_period: 14
    atr_multiple: 0.3              # 当日最低点下方 0.3×ATR14
  source: 行业惯例
  r_definition: abs(entry_price - stop_price)

# ---------------------------------------------------------------------------
# ⑤ 移动止损(多阶段)
# ---------------------------------------------------------------------------
stop_trail:
  stages:
    - name: 三根K线不启动退出
      when:
        days_held_lte: 3
        failed_to_leave_cost_zone: true
        close_below_signal_bar_open: true
      action: exit_unconditional     # ★ 无条件平仓
      source: 行业惯例
      # ★ 「无法脱离成本区」没定义:成本区是进场价 ±多少?±0.5R?±1%?
      #   见审计报告 §2-N。★ 没有自己填。
      cost_zone_definition: null
      audit_blocked: §2-N
    - name: 保本
      when: { close_above_ma: 20 }
      action: move_stop_to_breakeven
      source: 行业惯例               # 站上 SMA20 后止损移到保本
    - name: 前低跟踪
      when: { after_stage: 保本 }
      type: lowest_low_trail
      params: { lookback: 10 }       # 之后沿前 10 日最低点向上跟随
      source: 行业惯例
  monotonic_up_only: true
  source: 原著

# ---------------------------------------------------------------------------
# ⑥ 离场
# ---------------------------------------------------------------------------
exit:
  rules:
    - type: close_below_ma
      params: { ma: 20 }
      source: 原著
    - type: close_below_trailing_stop
      source: 原著
  partial_exit: null                 # ★ 严禁分批止盈 —— 废除「+1.5R 平一半」
  profit_target_r: 2.0               # ★ 只留「+2.0R 全额清仓」物理空间封顶
  time_stop_days: null
  source: 行业惯例                   # Ralph Vince (1992);Robert Carver (2015)
  # ★★ 这一条是三个流派里**唯一一条由我们的实测否决了专家建议**的参数:
  #   专家原建议 +1.5R 平一半,★ 我们的实测否掉了,他书面认输,原话:
  #   「你们的做法 100% 正确,直接废除『+1.5R 平一半』,
  #     只保留『+2.0R 全额清仓』这一物理空间封顶。」
  #   他补的两处出处:Ralph Vince (1992);Robert Carver (2015)。
  #
  # ★★ 但有一处需要专家确认(见审计报告 §5-J):
  #   ★ 第一轮流派三的原文是「绝不设固定止盈 …… 收盘跌破 SMA20 或
  #     跌破前 10 日低点跟踪线 → 全平」—— **没有任何止盈**。
  #   ★ 现在加上 +2.0R 全清,等于给这条链**新增了一个固定止盈**,
  #     与第一轮「绝不设固定止盈」直接冲突。
  #   ★ 另外他这段答复没写是给哪条链的;「+2R 平半仓」的禁令出现在流派三,
  #     所以我落在流派三。★ 若他本意是流派二,需要挪位置。
  #   ★ 数值 2.0 照写,冲突如实标出,不替他决定。

# ---------------------------------------------------------------------------
# ⑦ 仓位
# ---------------------------------------------------------------------------
sizing:
  type: risk_fraction
  params:
    risk_per_trade: 0.005            # ★ 1.0% → 0.5%:信用利差闸门缺数据的代偿
    max_weight: 0.15                 # 单票名义上限 15%(止损极窄,严禁加杠杆)
    max_drawdown_tolerance_multiplier: 1.40   # ★ 回撤容忍度调高 40%(同上代偿)
  source: 行业惯例
  # ★★ 注意:单笔风险这里是 0.5%,不是专家原文的 1.0%。
  #   ★ 这不是我们改参数 —— 是专家为「信用利差闸门关着」给的代偿方案
  #     (见 regime.credit_ratio_gate.compensation_when_disabled)。
  #   ★★ HYG / LQD 数据到位、闸门打开后,这里必须改回 1.0%
  #     并把 max_drawdown_tolerance_multiplier 删掉。
  risk_per_trade_when_gate_enabled: 0.01     # 闸门恢复后用这个值
  # ★★ 注意一个实操后果:这条链止损极窄(当日最低下方 0.3×ATR14),
  #   1% 风险 ÷ 很小的止损距离 → 算出来的股数会非常大,
  #   15% 名义上限会频繁成为真正的约束条件(而不是风险预算)。
  #   ★ 这不是参数问题,是要在结果里标明「有多少笔是被 15% 顶住的」。

# ---------------------------------------------------------------------------
# slots / ranking
# ---------------------------------------------------------------------------
slots: null
# ★★ 仍然缺。第二轮专家只补了 ranking,没给流派三的持仓上限。
#   ★ 这条链在恐慌日会同时触发几十只票,没有 slots 就等于「全接」。
#   ★ 见审计报告 §2-E(第二轮后仍未答)。★ 没有自己填。

# ---------------------------------------------------------------------------
# 排序(第二轮专家补齐)
# ---------------------------------------------------------------------------
ranking:
  primary:
    formula: BCL = (Close - Low) / (High - Low)
    order: desc                      # 从大到小(收盘越靠当日高点越优先)
    source: 行业惯例
  tiebreak:
    field: hv_20
    order: asc                       # HV20 较低者优先
    source: 行业惯例
  # ★ 注意:主排序字段 BCL 同时也是进场门槛(≥0.65),
  #   所以排序实际是在「已过 0.65 门槛」的票里按 BCL 再排一次。
  #   这是自洽的,不是重复条件,但要在归因里说明。

# ---------------------------------------------------------------------------
# 摩擦成本与基准
# ---------------------------------------------------------------------------
costs:
  one_way_bps: 5.0
  source: 行业惯例
  # ★ 这条链单笔止损极窄、持仓周期短、换手最高,5bp 摩擦对它的影响
  #   远大于对流派一 —— 结果里必须同时看毛/净两条线。

benchmark:
  component_match: large
  risk_free_annual: null
