# ============================================================================
# 基-2 施洛斯极度分散 —— ★★★ 翻译登记版(2026-10-30,★ 跑之前提交)
#
# 三秒版:买跌破净资产的票,买得足够分散,让统计规律替你工作。
#
# ★★★ 红线③ 预先登记:本文件在**接触任何回测结果之前**提交。
#   ★ 登记之后无论结果多惨,★★ 公式一个字不改。
# ============================================================================
meta:
  name: 基-2_施洛斯极度分散
  master: 沃尔特·施洛斯
  method_card: 基-2
  question_answered: 买一堆便宜得离谱的破公司,买得足够分散,让统计规律替你工作。
  # ★ 方法卡原文(time_horizon_or_application):「市场恐慌、大量股票跌破净资产的时候。」
  # ★ 方法卡原文(data_requirement):「纯财务筛选 + 机械分散,完全可编。
  #   注意:这类标的买卖价差很宽,低换手不等于成本低。」
  # ★ 方法卡原文(出处完整性):「方法论来自访谈与公开记录;具体阈值是 XING 的实现。」
  evidence_note: >-
    ★★ 方法卡自己说「具体阈值是 XING 的实现」。★ 所以本配置里**唯一**的
    估值阈值 P/B < 1.0 **不是**从原著抄来的数,★★★ 而是「跌破净资产」
    这四个字的**无自由参数读法** —— 净资产就是 1.0 倍,没有别的读法。
    ★ 分散只数原著没给数字 → 见 slots 那一段的先验网格。

pit:
  effective: filing_date_plus_1_trading_day
  forbid: 严禁用报告期截止日
  missing_policy: 未公布期间沿用上一期(Forward-fill);第一次公布之前 = NaN = 不合格
  source: 原著
  # ★ 一律走 engine/fundamentals.py,★★ 本轮一个字没改

# ---------------------------------------------------------------------------
# ① 选股范围
# ---------------------------------------------------------------------------
universe:
  rules:
    - type: pb_below
      params: { threshold: 1.0 }
      source: 原著(无自由参数读法)
      # ★ P/B = 收盘价 / 每股净资产;每股净资产 = StockholdersEquity / 摊薄股数
      # ★★ 净资产 ≤ 0 的格子判**不合格** —— ★ 不许判成「极度便宜」
      #   (负净资产会让 P/B 变成负数、排在最便宜那一端,那是口径陷阱)
      # ★ 覆盖率:StockholdersEquity 层一 96.0% · 摊薄股数 96.4%
  # ★★★ 没有流动性门槛 —— 大+中池上 $5 万/日门槛实测挡 0 笔(已记录)
  # ★★ 但方法卡原文点名了「买卖价差很宽,低换手不等于成本低」
  #   → ★ 这一条**不靠闸门处理**,靠 costs 的分档摩擦,见文件末尾

# ---------------------------------------------------------------------------
# ② 环境过滤 —— ★★★ 红线① / 红线⑤ 都落在这一格,必须读完再改
# ---------------------------------------------------------------------------
regime:
  rules: []
  flatten_when_off: false
  # ★★★ Environment = Unspecified ?  ★ 不是 —— 方法卡**给了**使用条件:
  #   「市场恐慌、大量股票跌破净资产的时候。」
  # ★★★ 但这句话有一个红线①的问题,★ 本轮必须说出来而不是绕过:
  #   「大量股票跌破净资产」= 用**这条策略自己的因子(P/B)**做成的扩散指标。
  #   ★ 红线① 允许「全市场扩散指标」,所以它不算违规;
  #   ★★ 但它和「均线策略拿个股均线当环境」是**同一个方向上的毛病** ——
  #     环境开关和选股条件同涨同落,会把「没票可买」伪装成「环境不好」。
  #   → ★★★ 处置:**两条臂并列跑**,不挑一个:
  #       臂甲「不装条件」= regime 空(本文件)
  #       臂乙「装了条件」= 非牛市(SPY 收盘 < 200 日均线 或 200 日均线 20 日斜率 ≤ 0)
  #         ★ 这是「市场恐慌」的**正交**翻译:只用外部宽基指数 SPY,
  #           ★★ 一个新数都没拍 —— 参数逐字来自 engine/configs/vcp_momentum.yaml
  #           ② regime 前两条,已由 probe/regime_install_1030/regime_vectors_1030.py 固化。
  #         ★★★ 装法在 run 脚本里(`m.regime &= ~牛市`),★ 本文件不写死。
  # ★ 两条臂的差只剩环境这一个来源。

# ---------------------------------------------------------------------------
# ③ 进场扳机
# ---------------------------------------------------------------------------
entry:
  type: always
  fill: next_open_market
  source: 原著(机械底仓,无扳机)
  # ★★ 原著这一派**没有进场扳机** —— 过了筛选就买。
  #   ★ 所以 ③ 显式写成 always,★★★ 不是「我们忘了装扳机」。
  #   ★ 代价必须讲明:没有右侧确认 = 左侧接飞刀,★ 这正是流派一第二轮
  #     实测胜率 23.6% / 97% 被止损打掉的那个形状。★ 本条不设止损,
  #     所以它不会被那样打掉,★★ 但也就意味着它会一路拿着跌。

# ---------------------------------------------------------------------------
# ④ 初始止损 —— ★★★ 显式为「无」+ 出处
# ---------------------------------------------------------------------------
initial_stop:
  type: none
  source: >-
    ★★★ 原著明确不设止损 —— 施洛斯的做法是靠**分散**和**净资产底线**
    承担单票风险,不靠价格止损。★ 所以这一格是「明确为无 + 有出处」,
    ★★ 不是「空着」。
    ★★★ 代价(纪律,必须跟着每一个数走):1R = 进场价 → **R 退化成收益率**,
    ★ 这条链的每笔 R **不能和有止损的链放在同一列比**。

# ---------------------------------------------------------------------------
# ⑤ 移动止损
# ---------------------------------------------------------------------------
trailing_stop:
  type: none
  source: ★ 同 ④,原著无移动止损。

# ---------------------------------------------------------------------------
# ⑥ 离场
# ---------------------------------------------------------------------------
exit:
  type: rules
  rules:
    - type: screen_dropout
      params: { screen: 基-2 }
      source: 原著(无自由参数读法)
      # ★ 「不再便宜了就卖」= P/B 回到 1.0 以上那天收盘走。
      # ★★★ 原著的**再平衡频率**(一年一次?季度?)方法卡没给 ——
      #   ★ 本轮**没有拍这个数**,用的是「条件不再成立就走」这个
      #     唯一不含自由参数的读法。★★ 已列进要问 Gemini 的清单。

# ---------------------------------------------------------------------------
# ⑦ 加仓 —— ★ 显式为「无」+ 出处(四槽位齐全闸要求)
# ---------------------------------------------------------------------------
add_on:
  type: none
  source: ★ 原著未提加仓;全库 67 条策略一条都没有加仓(1030 已登记)。

# ---------------------------------------------------------------------------
# ⑧ 仓位
# ---------------------------------------------------------------------------
sizing:
  type: equal_weight
  params: { max_positions: 40, max_weight: 0.025 }
  source: ★ XING(原著只说「极度分散」,没给数)

slots: 40
slots_prior_grid: [20, 40, 60]
source_slots: >-
  ★★★ 红线② 禁止单点估计。「极度分散」原著没给数字 →
  ★ 声明 **3 个邻近点的先验网格 20 / 40 / 60**,
  ★★★ 考核标准是「3 个点必须全部同向稳健」,★ 不是挑最好的那一点。
  ★ 40 居中的理由:访谈里流传的说法是「~100 只」,★★ 但我们的回测池只有
  250 只有基本面数据的票,★★★ 100 只槽位会把半个池子买下来 ——
  那测的不是选股,是池子本身。★ 所以网格上限取 60。

ranking:
  primary: { formula: ADV20, order: desc }
  tiebreak: symbol
  source: >-
    ★ 占位排序(**不是策略的一部分**)—— 直接复用
    engine/run_fundamental.PLACEHOLDER_RANKING,★★ 本轮没有重写。
    ★ 槽位不够时买哪几只由它决定,结论对它敏感。

costs:
  friction_tiers: { high_liquidity_bps: 5.0, mid_liquidity_bps: 15.0,
                    low_liquidity_bps: 30.0 }
  source: 行业惯例
  # ★★ 用分档不用一刀切 —— ★ 方法卡原文点名「买卖价差很宽」,
  #   这一派的标的恰恰集中在低流动性档。★ 口径和三份流派配置一致。

benchmark:
  family: meanrev
  component_match: large
  risk_free_annual: null
  # ★★ 归均值回归族的理由和深度价值同一条:它赌的是「估值回归」,
  #   ★ 拿单边多头指数考核均值回归属「基准错配」(专家裁决,已采用)。
  # ★ 仓库没有短端利率序列,现金腿按 0% 记并在结果里标明。
