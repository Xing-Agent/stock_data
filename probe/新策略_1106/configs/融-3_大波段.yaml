# ============================================================================
# 融-3 · 大波段融合策略（纯技术，没有基本面）
#
# 三秒版：挑「涨得又稳又顺」的股票拿着，跌破 100 日线或掉出前列就走。
#
# ★★★ 这一类是我们最薄的 —— 原来只有海龟和法伯两条。
# ★★★ 一格缺零件，已留空并记明：**Clenow 分数**（见 meta.known_gap）。
# ★ 来源：Gemini 第 36 轮「大波段七槽位」。
# ============================================================================

meta:
  name: 融-3_大波段
  master: null
  book: null
  family_label: 大波段
  source_tier: 混合（逐格标）
  gemini_round: 36
  known_gap: >-
    ★★★ **Clenow 分数这一格做不了** —— engine 零件表里没有
    「90 天对数回归年化斜率 × R²」这个排序公式。
    ★ Clenow《Stocks on the Move》(2015) **原书写明了按这个分数排序**，
    所以它是 ①档（原著定义的分数，照原样复原**不撞红线** —— 它不是我们合成的）。
    ★★★ 但写它要改 engine（新增 ranking formula）→ 硬规矩不许。
    → ★★ 本条先用 `return_rank_percentile`（纯涨幅分位）替代，
      ★★★ **这是降级，不是等价**：Clenow 分数的要点正是用 R² 把
      「跳空暴涨」那类剔掉，纯涨幅分位剔不掉。
      ★ 所以本条**不能标成 Clenow**，只能标「行业版动量」。
    ★★★ **1106 第 41 轮补充（Gemini 答 + 我定的做法）：**
      ★★ Gemini 的判断比我们原来写的更重：用「相对强度为正」当进场事件，
        **等于把排名这一步整个丢了** —— ★ 牛市里过半股票都满足，先到先买，
        ★★★ 和 Clenow「精选龙头」**已经是两回事**。
      ★ 有学术支持「涨得稳的动量比跳空涨的更持久」：
        Da, Gurun, Warachka 2014（RFS，「温水煮青蛙」）；
        Bali, Cakici, Whitelaw 2011（JFE，彩票股）。★★ 两篇都真实存在。
      ★★★ **我定的做法：本条在零件补齐前，说明书一律注明
        「已退化成趋势跟随，不是 Clenow 动量」。**
      ★★ 另外 Gemini 说「Clenow 有 40% 以上收益来自定期重排」——
        ★★★ **没有出处，不采信**。
      ★★★ 这一句必须跟着结论一起报。
  param_gap: ★ 三个数跑相邻三点：动量回看天数、分位门槛、离场均线长度。

universe:
  rules:
    - type: price_above_ma
      params: { ma: 200 }
      source: ★★ ②档。★ Gemini：「个股在 100 日、200 日线上方」；本条先用 200
  # ★ 动量分位挪到 entry 的 roc_momentum 去了（它本身就是「排名进前 20% 那天」），
  #   ★★ 这里不再重复一道，否则同一个条件卡两遍、样本被无谓砍掉。
  source: ★ Gemini 建议的「90 日均成交额 ≥ 2000 万美元」不加（同前，和摩擦分层重复）

regime:
  rules:
    - type: index_above_ma
      params: { symbol: SPY, ma: 200 }
      source: ★★ ②档（Faber 2007；Brock 等 1992）
    - type: index_ma_slope
      params: { symbol: SPY, ma: 200, lookback: 20 }
      source: ★★ ②档。★ Gemini：「SPY 在 200 日线上方，且 200 日线往上走」
  flatten_when_off: false
  source: ★ 接法同前两条

entry:
  rules:
    - type: mansfield_rs_positive
      params: { against: SPY, lookback: 90 }
      source: >-
        ★★ ②档 行业改进。★ 曼斯菲尔德相对强度（RS）对 SPY 为正 =
        **跑得比大盘强**，转成事件 = 「由弱转强的那一天」。
        ★★ 出处：Mansfield RS 是温斯坦（Weinstein 1988）体系里的核心指标。
        ★★★ 仍是**降级**（见 meta.known_gap）：Clenow 原书的分数是
        「90 天对数回归斜率 × R²」，★ 用 R² 把跳空暴涨的剔掉；
        RS 为正只说明跑赢大盘，**剔不掉跳空暴涨**。**不得标成 Clenow。**
        ★ 回看期 90 天来自 Clenow 原书 → runner 跑 60/90/120 三点。
  signal_freeze: close
  fill: next_open
  source: >-
    ★★★ 2026-11-06 这一格我改了**四次**，前三次都猜错，如实记：
      ① `return_rank_percentile` → 拒绝：那是**选股池**规则。
      ② `close_above_ma(50)`     → 拒绝：那是**出场**规则。
      ③ `roc_momentum`           → 拒绝：★ 我以为它是进场零件，其实它也属**选股池**那一套
         —— **我读错了函数**（把 `_universe_rule_raw` 的类型表当成了进场的）。
      ④ `mansfield_rs_positive(against: SPY)` → 过了。
    ★★ 三次都是 **engine 明确拒绝并写明「★ 没有悄悄忽略它」** ——
    ★★★ 这道闸救了我三次：若它选择静默忽略，这条策略会在
    「**没有进场条件**」的状态下跑出一个成绩，而且没人会知道。
    ★★★ 真正该修的不是这一格，是**我的办法** —— 四次里每次都要跑几十分钟才知道错。
    已另写 `probe/新策略_1106/校验配置_1106.py`：只拿 8 只票调一次 matrices.build，
    ★ **同样的错 20 秒就能发现**。以后改配置先过它。

initial_stop:
  type: none
  source: >-
    ★★ Gemini 给大波段的止损是「从最高收盘价回撤 3 倍 ATR 的移动止损」，
    ★ 没给初始硬止损 → 这一格显式关掉（**不是忽略**）。
    ★★★ 代价：1R = 进场价，不能和有止损的链比每笔 R。

trailing_stop:
  type: chandelier
  params: { atr_period: 14, multiple: 3.0 }
  source: ★★ ②档。★ Gemini：「从最高收盘价回撤 3 倍 ATR」→ runner 跑 2.5/3.0/4.0

exit:
  rules:
    - type: close_below_ma
      params: { ma: 100 }
      source: ★★ ②档。★ Gemini：「跌破 100 日线，或分数掉出前 20%」
  params:
    profit_target_r: null
    time_stop_days: null
  fill: next_open
  source: >-
    ★★★ 「分数掉出前 20% 就走」这一条**没做** —— engine 的出场零件里
    没有「排序掉出某分位」这一类。★ 已记，和 Clenow 分数那件是同一个缺口。

sizing:
  type: risk_fraction
  params: { risk_per_trade: 0.01, max_positions: 10, max_weight: 0.10 }
  source: >-
    ★★★ Gemini 建议大波段「按波动率倒数分配、20–30 只」；
    ★ engine 没有「波动率倒数」这个 sizing 类型 → **本条用 risk_fraction**，
    ★★ 已记为第三个缺口。★ 槽位也保持 10（不是 20–30）以便和现有链可比。

slots: 10
source_slots: 执行细节

ranking:
  primary:
    formula: ADV20
    order: desc
    source: ★ 执行细节；★★ Gemini 建议按 Clenow 分数降序 —— 零件缺口，见 meta

costs:
  friction_tiers: { high_liquidity_bps: 5.0, mid_liquidity_bps: 15.0, low_liquidity_bps: 30.0 }
  source: 行业惯例

benchmark:
  family: trend
  component_match: large
  risk_free_annual: null          # ★★★ 待接 DGS3MO
