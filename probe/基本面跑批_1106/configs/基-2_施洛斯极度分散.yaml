provenance:
  composite: false
  method_cards:
  - 基-2
  per_rule_cards_filled: true
实现缺口:
  这一版缺哪几道闸:
  - 闸: ★ 「最好有长期经营历史」
    这一版怎么做: ★ 没装(卡原文是「最好」,不是硬条件;★ 也没给年数)
    成绩会偏哪边: ★ 方向不明
  - 闸: ★★ 买卖价差
    这一版怎么做: ★ 摩擦按全库统一三档;★★ 卡原文提醒「这类标的买卖价差很宽,低换手不等于成本低」→ ★★★ 我们的摩擦**可能偏低**(★ 有依据:卡原文)
    成绩会偏哪边: ★★ 偏高(★ 依据:卡原文明说价差宽,而我们按统一三档扣)
  结论怎么写:
    只许这么写: 「**这一版**(没装经营历史、摩擦按统一三档)……」
meta:
  name: 基-2_施洛斯极度分散
  master: 沃尔特·施洛斯
  card: 基-2
  book: 访谈与公开记录(★ 卡原文)
  family_label: 基本面
  三秒版: 买一堆股价低于每股净资产、负债不高的公司,买 60 只以上;价格回到账面价值就卖。
  known_gap: ★ 没装「长期经营历史」;★★ 摩擦可能偏低(★ 依据:卡原文说这类票价差很宽)
  param_gap: ★★ 「没有高负债」原著没给数 → 总负债/股东权益 ≤ 0.5 / 1.0 / 1.5 三点;★ 「低于每股净资产」= 市净率 < 1(★ 这就是那几个字本身,不是我们拍的数)
pit:
  effective: filing_date_plus_1_trading_day
  update_frequency: quarterly_discrete
  source: ★ 原著没写时点口径;★★ 引擎铁律(生效日 = 公布日 + 1 个交易日)
universe:
  rules:
  - type: pb_below
    params:
      max_pb: 1.0
    source: ★ ①档 卡原文「股价低于每股净资产」→ 市净率 < 1.0(★ 无自由参数读法)
  - type: fund_metric_threshold
    params:
      metric: liab_to_eq
      op: le
      value: 1.0
    source: ★ ①档 卡原文「公司没有高负债」;★★★ 阈值是 ③档我们的(原著没给)→ 跑三点
regime:
  rules: []
  flatten_when_off: false
  source: ★ 原著没有环境闸 → 不挂(★ 挂了就不是这条策略)
entry:
  type: always
  signal_freeze: close
  fill: next_open
  source: '★★★ ③档 我们的(执行细节)。★ 原著是「符合条件就买」,没有进场扳机 → `type: always` =「在池子里、有空槽就买」。★★ 不能写 rules: [] —— 那会落到默认
    never,一笔都不买(matrices.py:986)。'
initial_stop:
  type: none
  source: ★★ ①档 原著没有价格止损(★ 基本面派靠基本面离场;装止损会改变策略性质)
trailing_stop:
  type: none
  source: ★ 同上
exit:
  rules:
  - type: fund_rule_fails
    params:
      rule:
        type: pb_below
        params:
          max_pb: 1.0
      check: daily
    source: ★ ①档 卡原文「价格回到账面价值附近就卖,不等它涨成明星股」→ 市净率回到 ≥ 1 的收盘就卖
  params:
    profit_target_r: null
    time_stop_days: null
  fill: next_open
  source: ★ 不再满足条件就卖 —— 用本路覆盖层 fund_rule_fails 在检查日判
sizing:
  type: fixed_fraction
  rank_by:
    primary:
      formula: FUND:pb
      order: desc
    source: ★ ③档 我们的:名额不够时按市净率从低到高(★ 原著没说先买谁)
  params:
    max_weight: 0.0167
    max_positions: 60
  source: ★ ①档 卡原文「同时持有 60–100 只,单只占比很小」→ 取下沿 60,等权
costs:
  friction_tiers:
    high_liquidity_bps: 5.0
    mid_liquidity_bps: 15.0
    low_liquidity_bps: 30.0
  source: 行业惯例(★ 与其他链一致,便于横向比)
benchmark: SPY
扫参:
- 名: 负债0.5
  档: ③
  覆盖:
    universe.rules.1.params.value: 0.5
- 名: 负债1.0
  档: ③
  覆盖:
    universe.rules.1.params.value: 1.0
- 名: 负债1.5
  档: ③
  覆盖:
    universe.rules.1.params.value: 1.5
