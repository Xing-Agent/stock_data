# ============================================================================
# 基-4 · 神奇公式（质量 + 价值）· 乔尔·格林布拉特
#
# ★ 三秒版：只看两件事 —— 这门生意赚钱效率高不高（资本回报率），
#   现在的价格贵不贵（盈利收益率）。两个排名加起来最靠前的就买。
#
# ★★★ 三格缺零件，已记明 —— 见 实现缺口。
# ★ 来源：方法卡 基-4（★★ 逐句抄卡里的「正文资料」，不改写口径）。
# ============================================================================

provenance:
  composite: false
  method_cards: ["基-4"]
  per_rule_cards_filled: true

实现缺口:
  这一版缺哪几道闸:
    - 闸: ★★★ 原著的「**两个名次相加**取最靠前」
      位置: universe（★ 我们改成了两个分位闸 AND 在一起）
      为什么装不上: >-
        ★★★ 引擎只有「分位筛选」（留前 N%），**没有「两个排名相加再排序」**这个零件。
        ★★ 两者**不等价**：原著允许「资本回报率第 300 名 + 盈利收益率第 5 名」这种组合
        （名次和 = 305，可能入选）；
        ★ 而两个分位闸 AND 在一起，会把「一项特别好、另一项中等」的票**全部剔掉**。
      缺了它这一派还剩什么: >-
        ★ 退回成「两项都在前列」—— ★★ 比原著**更严**，选出来的票更少。
      成绩会偏哪边: >-
        ★★★ **方向不明，不许写「偏高」或「偏低」**。
        ★ 更严可能选出更好的票（偏高），也可能漏掉原著真正要的那批（偏低）。
        ★★ 已写进第 44 轮问 Gemini（问题 5a：只能加 8 个指标会加哪 8 个）。
    - 闸: ★★ 原著的「**持有一年后整体重排**」
      位置: exit（★ 定期调仓）
      为什么装不上: >-
        ★★★ 引擎**没有「定期重排」零件** —— 只能事件触发进场、事件触发离场。
        ★ 这一条和融-3 的同一个缺口（第 41 轮 Gemini：对截面类策略「换了等于换策略」）。
      这一版用什么替代: >-
        ★ **持有 252 个交易日无条件平仓**（time_stop_days: 252）——
        ★★★ 这是「持有一年」最接近的可算读法，★ 但**不是重排**：
        它只保证「满一年就走」，不保证「走了之后换入当时最靠前的一批」。
    - 闸: ★ 原著的「**排除金融股和公用事业**」
      位置: universe
      为什么装不上: >-
        ★★★ 我们**没有历史时点的行业分类**（只有今天的快照，
        `matrices.py:347` 用到历史行业时直接报错 —— ★ 这点引擎做得对，不猜）。
        ★★ 11 只行业 ETF 只能当「行业涨跌」的代理，**不能给个股贴行业标签**。
      缺了它会怎样: >-
        ★★★ 池子里会混进银行、保险、公用事业 —— ★★ 而它们的资本回报率口径
        和实业公司**不可比**（银行的「有形资本」是另一回事）。
        ★ 所以这一版的 ROC 排名**被污染了**，★★ 这一句必须跟着结论一起报。
  结论怎么写:
    不许这么写: ["神奇公式无效", "神奇公式不成立", "格林布拉特那套没用"]
    只许这么写: >-
      「**这一版**（缺「两个名次相加」、缺「定期重排」、缺「排除金融与公用事业」
      三道实现）没有通过检验」。
    理由: >-
      ★ 三道缺口里一道是**引擎缺零件**、一道是**引擎缺机制**、一道是**数据没有** ——
      ★★★ 都不是「这个方法试过了不行」。

meta:
  name: 基-4_神奇公式
  master: 乔尔·格林布拉特
  book: 《The Little Book That Still Beats the Market》（★ 页码待核）
  family_label: 基本面
  source_tier: 混合（逐格标）
  card: 基-4
  pricing_belief: >-
    ★ 市场会给「赚钱效率高但暂时便宜」的公司错误定价；
    ★★ 两个指标相加能同时抓住质量和价格。
  known_gap: >-
    ★★★ 见 实现缺口 —— 三格：名次相加 · 定期重排 · 排除金融与公用事业。
  param_gap: >-
    ★★ 原著**没给**「最靠前的一批」是前百分之多少 →
    ★★★ 跑相邻三点（前 10% / 20% / 30%），并报三点是否同向。
  教学用途: >-
    ★ 方法卡第④栏写的是「教学与展示；不进交易契约的风险计算」——
    ★★★ 所以这一版的成绩**不得用于**具体标的的自动进出场或仓位计算。

pit:
  effective: filing_date_plus_1_trading_day
  update_frequency: quarterly_discrete
  source: ★ 原著没写时点口径；★★ 这是引擎的铁律（生效日 = 公布日 + 1 个交易日）

# ① 选股池 ★★★ 两个指标各取前 N%（★ 原著是名次相加，见 实现缺口）
universe:
  rules:
    - type: roc_rank_top
      params: { rank_top_pct: 20 }
      source: >-
        ★ ①档 原著原文：「用**资本回报率（息税前利润 / 有形资本）**给全市场排名」。
        ★★ 我们的算法：EBIT_TTM ÷（净运营资本 + 净固定资产）——
        ★★★ 这是格林布拉特自己给的「有形资本」口径。
        ★★ 分母 ≤ 0 → 算不出（NaN），**不取绝对值、不设下限**（那会造出假的高 ROC）。
        ★ 前 20% 这个数是**我们挑的** → 跑相邻三点。
    - type: steady_earnings_yield_top
      params: { rank_top_pct: 20 }
      source: >-
        ★ ①档 原著原文：「**盈利收益率（息税前利润 / 企业价值）**」。
        ★★ 我们的算法：稳态 EBIT（近 20 季中位 × 4）÷ 企业价值
        （市值 + 总债 − 现金）。
        ★★★ **口径差异要说清**：原著用的是**当期** EBIT，
        我们用**近 5 年中位数** —— ★ 这是 ③档「我们的」，
        目的是避免一次性损益把一年的 EBIT 带偏；
        ★★ 代价是**反应慢**（★ 刚转好的公司会被低估）。
        ★ 前 20% 同样是我们挑的 → 跑相邻三点。
  source: ★ 原著只给这两条；★★ 我们**没有**额外加成交额或市值门槛（★ 避免和摩擦分层重复）

# ② 环境闸 ★★★ 原著明确不做择时
regime:
  rules: []
  flatten_when_off: false
  source: >-
    ★★★ ①档 原著：「作为**长期机械执行**的底仓方法」、
    「它会有连续几年跑输，那正是它长期有效的原因」——
    ★★ 所以**不挂环境闸**。★ 挂了就不是这条策略了。

# ③ 进场
entry:
  logic: all
  rules: []
  signal_freeze: close
  fill: next_open
  source: >-
    ★★★ ③档 我们的（**执行细节，不是原著的选股条件**）。
    ★ 原著是「排名靠前就买」，**没有进场扳机**。
    ★★ 所以这里**留空** —— 等价于「只要在选股池里，次日开盘就买」。
    ★★★ 如果引擎不允许空进场，见 实现缺口 第四格。

# ④ 止损 ★★★ 原著没有止损
initial_stop:
  type: none
  source: >-
    ★★★ ①档 原著**没有止损** —— ★ 它是「持有一年后整体重排」。
    ★★ 装一个止损就改变了这条策略的性质（★ 会把「连续几年跑输」那段提前砍掉，
    而原著明说那正是它有效的原因）。

trailing_stop:
  type: none
  source: ★ 同上

# ⑤ 离场
exit:
  rules: []
  params:
    profit_target_r: null
    time_stop_days: 252
  fill: next_open
  source: >-
    ★★ ①档 原著：「**持有一年后整体重排**」。
    ★★★ 我们只能做到「满 252 个交易日无条件平仓」——
    ★ **不是重排**（见 实现缺口 第二格）。

# ⑥ 仓位
sizing:
  type: fixed_fraction
  params:
    max_weight: 0.0333
    max_positions: 30
  source: >-
    ★★ ③档 我们的。★ 原著是「取最靠前的一批，等权持有」，**没给具体只数**。
    ★★★ 我们用 30 个槽位、每只 1/30 —— ★ 这是**等权**，和原著的「等权」一致；
    ★★ 30 这个数是我们挑的（★ 原著提到 20~30 只这个量级，★★★ 页码待核）。
    ★ 这里**不用按风险定仓**（risk_fraction）——
    ★★★ 因为原著没有止损，按风险定仓会退化成「按进场价定仓」，口径更糊。

costs:
  friction_tiers:
    high_liquidity_bps: 5.0
    mid_liquidity_bps: 15.0
    low_liquidity_bps: 30.0
  source: 行业惯例（★ 与其他链一致，便于横向比）

benchmark: SPY
