# ============================================================================
# 基-4 · 神奇公式（质量 + 价值）· 乔尔·格林布拉特
#
# ★ 三秒版：只看两件事 —— 这门生意赚钱效率高不高（资本回报率），
#   现在的价格贵不贵（盈利收益率）。两个排名加起来最靠前的就买。
#
# ★★★ 三格缺零件，已记明 —— 见 实现缺口。
# ★ 来源：方法卡 基-4（★★ 逐句抄卡里的「正文资料」，不改写口径）。
# ============================================================================

provenance:
  composite: false
  method_cards: ["基-4"]
  per_rule_cards_filled: true

实现缺口:
  这一版缺哪几道闸:
    - 闸: ★★★ 原著的「**两个名次相加**取最靠前」
      位置: 排序（sizing.rank_by）
      现状: >-
        ★★★ **1106 晚 A 路已装上**（本路覆盖层 `策略零件_1106.py` 的排序 FUND:magic）——
        ★ 两个指标都算得出的票进池，★★ 槽位按「资本回报率名次 + 盈利收益率名次」**之和**从小到大填。
        ★ 这就是原著的选法；原来那版「两个分位闸 AND」已撤（它比原著更严、方向不明）。
      为什么以前装不上: >-
        ★ 引擎只有「分位筛选」，没有「两个排名相加再排序」；
        ★★ 而且没写 rank_by 时引擎**默认按 126 日涨幅**挑（matrices.py:1160）——
        等于给神奇公式偷偷加了一道动量闸。
    - 闸: ★★ 原著的「**持有一年后整体重排**」
      位置: exit（★ 定期调仓）
      为什么装不上: >-
        ★★★ 引擎**没有「定期重排」零件** —— 只能事件触发进场、事件触发离场。
        ★ 这一条和融-3 的同一个缺口（第 41 轮 Gemini：对截面类策略「换了等于换策略」）。
      这一版用什么替代: >-
        ★ **持有 252 个交易日无条件平仓**（time_stop_days: 252）——
        ★★★ 这是「持有一年」最接近的可算读法，★ 但**不是重排**：
        它只保证「满一年就走」，不保证「走了之后换入当时最靠前的一批」。
    - 闸: ★ 原著的「**排除金融股和公用事业**」
      位置: universe
      为什么装不上: >-
        ★★★ 我们**没有历史时点的行业分类**（只有今天的快照，
        `matrices.py:347` 用到历史行业时直接报错 —— ★ 这点引擎做得对，不猜）。
        ★★ 11 只行业 ETF 只能当「行业涨跌」的代理，**不能给个股贴行业标签**。
      缺了它会怎样: >-
        ★★★ 池子里会混进银行、保险、公用事业 —— ★★ 而它们的资本回报率口径
        和实业公司**不可比**（银行的「有形资本」是另一回事）。
        ★ 所以这一版的 ROC 排名**被污染了**，★★ 这一句必须跟着结论一起报。
  结论怎么写:
    不许这么写: ["神奇公式无效", "神奇公式不成立", "格林布拉特那套没用"]
    只许这么写: >-
      「**这一版**（缺「两个名次相加」、缺「定期重排」、缺「排除金融与公用事业」
      三道实现）没有通过检验」。
    理由: >-
      ★ 三道缺口里一道是**引擎缺零件**、一道是**引擎缺机制**、一道是**数据没有** ——
      ★★★ 都不是「这个方法试过了不行」。

meta:
  name: 基-4_神奇公式
  master: 乔尔·格林布拉特
  book: 《The Little Book That Still Beats the Market》（★ 页码待核）
  family_label: 基本面
  source_tier: 混合（逐格标）
  card: 基-4
  pricing_belief: >-
    ★ 市场会给「赚钱效率高但暂时便宜」的公司错误定价；
    ★★ 两个指标相加能同时抓住质量和价格。
  known_gap: >-
    ★★★ 见 实现缺口 —— 还剩两格：定期重排（只能做「满一年平仓、空槽按名次补」）· 排除金融与公用事业（没有历史时点行业分类）。★ 名次相加那格 1106 晚已装上。
  param_gap: >-
    ★★ 原著给的是「买 20~30 只」（★ 页码待核）—— 只数是唯一自由参数 →
    ★★★ 跑相邻三点（20 / 30 / 40 只，每只等权），并报三点是否同向。
    ★ 原来那版的「前 10%/20%/30%」已撤 —— 改成名次相加之后那个数不存在了。
  教学用途: >-
    ★ 方法卡第④栏写的是「教学与展示；不进交易契约的风险计算」——
    ★★★ 所以这一版的成绩**不得用于**具体标的的自动进出场或仓位计算。

pit:
  effective: filing_date_plus_1_trading_day
  update_frequency: quarterly_discrete
  source: ★ 原著没写时点口径；★★ 这是引擎的铁律（生效日 = 公布日 + 1 个交易日）

# ① 选股池 ★★★ 两个原著指标都算得出才进池;★★ 谁先买由「名次相加」排序决定(见 ⑥ rank_by)
universe:
  rules:
    - type: magic_formula_available
      params: {}
      source: >-
        ★ ①档 原著原文：「用**资本回报率（息税前利润 / 有形资本）**和**盈利收益率
        （息税前利润 / 企业价值）**分别给全市场排名，两个名次相加，取最靠前的一批」。
        ★★ 两个指标的算法：ROC = EBIT_TTM ÷（净运营资本 + 净固定资产）；
        EY = EBIT_TTM ÷（市值 + 总债 − 现金）—— ★★★ 用**当期** EBIT（原著口径），
        不再用原来那版的「近 5 年稳态 EBIT」（那是 ③档我们的）。
        ★ 分母 ≤ 0 → 算不出（NaN）→ 不进池，不取绝对值、不设下限。
  source: ★ 原著只给这两条；★★ 我们**没有**额外加成交额或市值门槛（★ 池子本身已是大+中口径）

# ② 环境闸 ★★★ 原著明确不做择时
regime:
  rules: []
  flatten_when_off: false
  source: >-
    ★★★ ①档 原著：「作为**长期机械执行**的底仓方法」、
    「它会有连续几年跑输，那正是它长期有效的原因」——
    ★★ 所以**不挂环境闸**。★ 挂了就不是这条策略了。

# ③ 进场
entry:
  type: always
  signal_freeze: close
  fill: next_open
  source: >-
    ★★★ ③档 我们的（**执行细节，不是原著的选股条件**）。
    ★ 原著是「排名靠前就买」，**没有进场扳机** → ★★ 写成 `type: always` =「在池子里、有空槽就买」。
    ★★★ ⚠ 1106 晚 A 路查实：原来写的 `rules: []` **一笔都不会买** ——
    `entry_trigger` 遇到空 rules 会落到 type 默认值 "never"（matrices.py:986）。
    校验器不报错，是因为「一笔都不买」不是错误。

# ④ 止损 ★★★ 原著没有止损
initial_stop:
  type: none
  source: >-
    ★★★ ①档 原著**没有止损** —— ★ 它是「持有一年后整体重排」。
    ★★ 装一个止损就改变了这条策略的性质（★ 会把「连续几年跑输」那段提前砍掉，
    而原著明说那正是它有效的原因）。

trailing_stop:
  type: none
  source: ★ 同上

# ⑤ 离场
exit:
  rules: []
  params:
    profit_target_r: null
    time_stop_days: 252
  fill: next_open
  source: >-
    ★★ ①档 原著：「**持有一年后整体重排**」。
    ★★★ 我们只能做到「满 252 个交易日无条件平仓」——
    ★ **不是重排**（见 实现缺口 第二格）。

# ⑥ 仓位
sizing:
  type: fixed_fraction
  rank_by:
    primary: { formula: "FUND:magic", order: desc }
    source: >-
      ★★★ ①档 原著：「两个名次相加，取最靠前的一批」→ 名次和越小越优先。
      ★★ 不写这一格引擎会默认按 126 日涨幅挑（matrices.py:1160）—— 那不是原著。
  params:
    max_weight: 0.0333
    max_positions: 30
  source: >-
    ★★ ③档 我们的。★ 原著是「取最靠前的一批，等权持有」，**没给具体只数**。
    ★★★ 我们用 30 个槽位、每只 1/30 —— ★ 这是**等权**，和原著的「等权」一致；
    ★★ 30 这个数是我们挑的（★ 原著提到 20~30 只这个量级，★★★ 页码待核）。
    ★ 这里**不用按风险定仓**（risk_fraction）——
    ★★★ 因为原著没有止损，按风险定仓会退化成「按进场价定仓」，口径更糊。

costs:
  friction_tiers:
    high_liquidity_bps: 5.0
    mid_liquidity_bps: 15.0
    low_liquidity_bps: 30.0
  source: 行业惯例（★ 与其他链一致，便于横向比）

benchmark: SPY

# ★★ 扫参(相邻三点)—— 跑批器读这一块
扫参:
  - { 名: 20只, 档: "①原著区间下沿", 覆盖: { sizing.params.max_positions: 20, sizing.params.max_weight: 0.05 } }
  - { 名: 30只, 档: "①原著区间上沿", 覆盖: { sizing.params.max_positions: 30, sizing.params.max_weight: 0.0333 } }
  - { 名: 40只, 档: "③相邻点", 覆盖: { sizing.params.max_positions: 40, sizing.params.max_weight: 0.025 } }
