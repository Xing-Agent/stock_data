# ★★★ 预先登记配置 —— 本文件在任何一次回测之前落盘。
# ★ 登记之后无论结果多惨,公式一个字不改(《35》红线)。
pit:
  effective: filing_date_plus_1_trading_day
  forbid: 严禁用报告期截止日
  missing_policy: 未公布期间沿用上一期(Forward-fill);第一次公布之前 = NaN = 不合格
  source: 原著
regime:
  rules: []
  flatten_when_off: false
  environment_declaration: Unspecified
  source: ★★★ 原著没给市场级使用条件 → 显式声明 Unspecified,★ **没有悄悄当成「常开」**(《35》口径⑤ / 红线⑤)。
entry:
  type: always
  fill: next_open_market
  source: 原著(机械筛选,过了筛选就买,无进场扳机)
initial_stop:
  type: none
  source: ★★★ 原著这一派不设价格止损 —— 靠分散和筛选条件承担单票风险。★ 所以这一格是「明确为无 + 有出处」,不是「空着」。★★ 代价:1R = 进场价 → **R 退化成收益率**,★★★
    不能和有止损的链放在同一列比。
trailing_stop:
  type: none
  source: ★ 同 ④,原著无移动止损。
add_on:
  type: none
  source: ★ 原著未提加仓;全库一条都没有加仓(1030 已登记)。
sizing:
  type: fixed_fraction
  params:
    max_positions: 30
    max_weight: 0.033333
  source: ★ XING(原著只说分散持有,没给只数)
slots: 30
slots_prior_grid:
- 15
- 30
- 45
source_slots: ★★★ 《35》口径⑤ 禁止单点估计。槽位数原著没给 → 声明 3 个邻近点 15 / 30 / 45,★ 考核标准是「3 点同向」,★★★ 不是挑最好的那一点。
ranking:
  primary:
    formula: ADV20
    order: desc
  tiebreak: symbol
  source: ★ 占位排序(**不是策略的一部分**),沿用 engine/run_fundamental.PLACEHOLDER_RANKING。★★ 槽位不够时买哪几只由它决定,结论对它敏感。
costs:
  friction_tiers:
    high_liquidity_bps: 5.0
    mid_liquidity_bps: 15.0
    low_liquidity_bps: 30.0
  source: 行业惯例
  note: ★ 按《23 摩擦口径统一-1104》拍板的三档(5/15/30 bp,进出各扣一次),★★ 不用一刀切 —— 一刀切会系统性补贴随机对照组。
benchmark:
  family: trend
  component_match: large
  risk_free_annual: null
  note: ★ 仓库没有短端利率序列,现金腿按 0% 记并在结果里标明。
_r_note: ''
meta:
  name: 扩8_趋势模板AND盈利加速_我们组合的
  master: Mark Minervini(价格那一半)+ 盈利加速(基本面那一半)
  chain_id: 扩8-ours
  ★三秒版: 买「价格已经在领先、而且营收和每股收益的增速还在往上走」的票。
  ★★★归属: ★★★ **只做「我们组合的」一版** —— ★ 这是融合条目,**没有单一原著**,★★ 归属如实标:价格那一半来自 Minervini 趋势模板,盈利加速那一半是我们按「增速在往上走」的符号读法做的,★★★
    原书那个「营收和 EPS 增长 20% 以上」的数**本轮没有拍**(出处还没回原文核,见《18》第 3 条)。
  pre_registered: probe/expand_run_1104/configs_1104/ —— ★ 本文件在任何一次回测之前落盘
  ★★★原著版: ⬜ **不跑** —— 没有单一原著(《35》跑的清单第 8 行)。
universe:
  rules:
  - type: ma_stack_bullish
    params:
      mas:
      - 50
      - 150
      - 200
      require_price_above_all: true
    source: 原著(Minervini 趋势模板的均线叠放)
  - type: return_rank_percentile
    params:
      lookback: 126
      min_percentile: 80
    source: 我们的(档位原著没给,3 点网格)
  - type: earnings_acceleration
    params:
      require: rev_and_eps
    source: 我们的(符号条件,无阈值)
exit:
  type: rules
  rules:
  - type: screen_dropout
    params:
      screen: 扩8-ours
    source: 原著(无自由参数读法)
  note: ★ 「筛选条件不再成立」那天收盘走。★★★ 原著的再平衡频率方法卡没给 —— 本轮**没有拍这个数**,★ 用的是唯一不含自由参数的读法。
rank_prior_grid:
- 70
- 80
- 90
source_rank: ★★★ 「相对强度排前面」的具体档位没有原著 → 按《35》口径⑤ 跑相邻三点 70 / 80 / 90,主格 80,★ 报「三点是否同向」,★★★ 不报最好的那一点。
